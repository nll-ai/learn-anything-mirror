<style>
  :root{
    --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; --panel:#ffffff;
    --accent:#2563eb;

    --hover-bg:#eff6ff; --match:#f59e0b; --btn-hover-border:#94a3b8;

  html,body{height:100%;height:100dvh;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}

  .searchwrap{position:relative}

  .edge path.line{stroke:var(--edge);stroke-width:1.3;fill:none;transition:stroke-width .1s}

  .here-jump:hover{text-decoration:underline}
  .chipbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:14px;font-weight:600;cursor:pointer;background:var(--panel)}

    .edge path.hit{stroke-width:28}

    .brand{flex:1}
    header h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    header .stats,.spacer{display:none}
    .iconbtn,.narrow-only{display:inline-flex}
    .sheet-head.narrow-only{display:flex}
    .toolbar{position:relative;flex-shrink:0}
    .searchwrap{display:none;flex:1;min-width:0}
    header.search-open .brand{display:none}
    header.search-open .searchwrap{display:block}
    header.search-open #btn-more{display:none}
    #search{width:100%;min-height:44px;font-size:16px;padding:10px 12px}
    #results{left:0;right:0;width:100%;top:calc(100% + 6px);max-height:min(50dvh,360px)}
    #results div{min-height:44px;display:flex;align-items:center;padding:10px 12px}
    .toolbar-actions{display:none;position:absolute;top:calc(100% + 6px);right:0;flex-direction:column;align-items:stretch;min-width:196px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.16);z-index:80}
    header.menu-open .toolbar-actions{display:flex}
    .toolbar-actions button{min-height:44px;width:100%;text-align:left;padding:10px 12px}
    button,.iconbtn,.chipbtn,#panel .backlink,#panel summary{min-height:44px}
    .chipbtn{padding:10px 14px}
    #hint{display:none}
    #legend{display:none;position:fixed;left:0;right:0;bottom:0;top:auto;max-width:none;max-height:min(52dvh,460px);overflow:auto;z-index:60;border-radius:16px 16px 0 0;border:1px solid var(--line);background:var(--panel);padding:12px 16px calc(16px + var(--safe-b));box-shadow:0 -8px 28px rgba(15,23,42,.16)}
    #legend.is-open{display:block}
    #legend .lvlchip{min-width:44px;min-height:44px;justify-content:center}
    #tt{position:fixed;left:0;right:0;bottom:0;top:auto;max-width:none;max-height:min(42dvh,360px);overflow:auto;pointer-events:auto;border-radius:16px 16px 0 0;padding:12px 16px calc(16px + var(--safe-b));z-index:70}
    #panel .backlink{display:inline-flex;align-items:center;min-height:44px;padding-right:8px}
    #tt .sheet-handle,#legend .sheet-handle,#panel .sheet-handle{display:block}
    button,.iconbtn{touch-action:manipulation}
    #panel,#legend,#tt{-webkit-overflow-scrolling:touch}
    #panel{position:fixed;left:0;right:0;bottom:0;width:100%;max-height:min(58dvh,520px);border-left:none;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 16px calc(18px + var(--safe-b));z-index:60;transform:translateY(110%);box-shadow:0 -8px 28px rgba(15,23,42,.16)}
    #panel.is-open{transform:translateY(0)}
    #scrim.is-on{display:block;position:fixed;inset:0;background:rgba(15,23,42,.28);z-index:45}
  }
</style>

<header>

    <span class="stats" id="stats"></span>
  </div>
  <div class="spacer"></div>
  <div class="toolbar">
    <button type="button" id="btn-search-toggle" class="iconbtn narrow-only" aria-label="Search concepts" aria-expanded="false" title="Search">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.25" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.2 15.2 21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

    </div>

      <button type="button" id="btn-theme" title="Toggle themed / default skin">Themed</button>

    </button>

  <div id="canvaswrap">
    <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>

<script>
/*DATA-START*/
const DATA =
{
  "nodes": [
    {
      "id": "outcomes-and-events",
      "phase": 0,
      "label": "Outcomes and events",
      "desc": "An outcome is one result of a random process. An event is a set of those outcomes, the thing you assign a probability to.",
      "outline": [
        "Name the random process and one outcome it can produce",
        "Collect outcomes into an event, written as a set",
        "See that data work usually starts from events, not single outcomes",
        "Check two events for shared outcomes before you add their probabilities"
      ],
      "ideas": [
        "A die roll's outcomes are the faces; the event 'even' is the set {2, 4, 6}",
        "Disjoint events share no outcomes, so at most one of them happens",
        "OpenIntro treats events as the sets you actually compute with"
      ],
      "questions": [
        {
          "q": "In a die roll, what is the difference between the outcome 2 and the event 'even'?",
          "a": "The outcome 2 is a single result. The event 'even' is the set of outcomes {2, 4, 6}. Probability statements in this course attach to events."
        },
        {
          "q": "What breaks if you treat two events as disjoint when they share an outcome?",
          "a": "The addition rule for disjoint events no longer applies. OpenIntro's card example is the warning: events that share an outcome are not disjoint, and adding their probabilities double-counts the overlap."
        },
        {
          "q": "A loan is recorded as rent, mortgage, or own. Why are those three events disjoint?",
          "a": "Each loan sits in exactly one homeownership category, so the three events share no outcomes. That is why their probabilities may be added."
        }
      ],
      "sources": [
        {
          "t": "Diez, Çetinkaya-Rundel, and Barr, OpenIntro Statistics, 4th ed., Chapter 3 (2019)",
          "u": "https://www.openintro.org/book/os/"
        },
        {
          "t": "Laplace, A Philosophical Essay on Probabilities (Truscott and Emory, 1902)",
          "u": "https://www.gutenberg.org/ebooks/58881"
        }
      ]
    },
    {
      "id": "sample-space",
      "phase": 0,
      "label": "The sample space",
      "desc": "The sample space is the set of every outcome the process can produce. Conditioning later replaces it with the outcomes still possible.",
      "outline": [
        "List every outcome the process can produce",
        "Require that the list covers the process and does not double-count",
        "Mark an event as a subset of that list",
        "Notice that new information can shrink the list, which is the start of conditioning"
      ],
      "ideas": [
        "Laplace's first principle takes probability as favorable cases over all cases possible",
        "Grinstead starts from a sample space with a distribution, then shrinks it once an event is known",
        "If the list of cases is wrong, every later ratio is wrong"
      ],
      "questions": [
        {
          "q": "What does Laplace's first principle count in the denominator?",
          "a": "All the cases possible. Probability is the ratio of favorable cases to that full count, which is the sample space under equal possibility."
        },
        {
          "q": "In Grinstead's die example, the roll is known to be greater than 4. What is the new sample space?",
          "a": "Only the outcomes still possible remain: 5 and 6. The original space {1, 2, 3, 4, 5, 6} has been replaced by the event that occurred."
        },
        {
          "q": "What fails if two listed cases are not the equally possible cases Laplace requires?",
          "a": "The ratio of counts is not yet a probability. Laplace's second principle says you first weight unequal cases, then add the weights of the favorable ones. d'Alembert's three-case count of two coin tosses is the mistake."
        }
      ],
      "sources": [
        {
          "t": "Laplace, A Philosophical Essay on Probabilities (Truscott and Emory, 1902)",
          "u": "https://www.gutenberg.org/ebooks/58881"
        },
        {
          "t": "Grinstead and Snell, Introduction to Probability, Chapter 4 (GNU FDL)",
          "u": "https://math.dartmouth.edu/~doyle/docs/prob/prob.pdf"
        }
      ]
    },
    {
      "id": "counting-cases",
      "phase": 0,
      "label": "Counting cases",
      "desc": "When the cases are equally possible, probability is a count of favorable cases over a count of all cases. Most later Bayes arithmetic is still that count.",
      "outline": [
        "Count the equally possible cases",
        "Count how many of them are favorable",
        "Form the ratio, and refuse the ratio if the cases were not equally possible",
        "Keep the counts when you can: a later test problem is easier in whole numbers than in percents"
      ],
      "ideas": [
        "Laplace: probability is favorable cases over equally possible cases",
        "Unequal cases must be reduced to equally possible ones before you count, as in his two-toss coin",
        "A table of counts is the same ratio with the denominator left visible"
      ],
      "questions": [
        {
          "q": "Laplace throws a thin coin twice and wants heads at least once. Why is the probability 3/4 rather than 2/3?",
          "a": "Four equally possible sequences exist: HH, HT, TH, TT, and three favor the event. d'Alembert's three-case list treats unequal cases as equal. Laplace's second principle restores the four equally possible cases and the ratio 3/4."
        },
        {
          "q": "Two dice are thrown. Why is the chance of two aces 1/36?",
          "a": "Each face of one die pairs with each face of the other, giving 36 equally possible cases, and one of them is two aces. Laplace's third principle records that product."
        },
        {
          "q": "What breaks if you cancel the counts down to a percent before you finish a test problem?",
          "a": "You hide the denominator you still need. Later nodes keep the counts because the positive calls are a count of true positives plus false alarms, and that comparison is the whole update."
        }
      ],
      "sources": [
        {
          "t": "Laplace, A Philosophical Essay on Probabilities (Truscott and Emory, 1902)",
          "u": "https://www.gutenberg.org/ebooks/58881"
        },
        {
          "t": "Diez, Çetinkaya-Rundel, and Barr, OpenIntro Statistics, 4th ed., Chapter 3 (2019)",
          "u": "https://www.openintro.org/book/os/"
        }
      ]
    },
    {
      "id": "long-run-frequency",
      "phase": 0,
      "label": "Long-run frequency",
      "desc": "One reading of probability is how often the event would happen in a long run of repeats. Screening numbers are that reading, counted in a population.",
      "outline": [
        "Read a percent as a count per hundred, or per thousand, repeats",
        "Separate that long-run rate from a single person's situation",
        "Use a population table when the repeats are people, not coin tosses",
        "Keep this reading available when a problem gives prevalence and error rates"
      ],
      "ideas": [
        "OpenIntro's loan table turns 10,000 borrowers into proportions by counting",
        "A test's accuracy is a long-run rate across people, not one person's chance of disease",
        "Hoffrage's physicians were given prevalence, sensitivity, and a false-positive rate: three long-run rates"
      ],
      "questions": [
        {
          "q": "OpenIntro reports 3,858 renters among 10,000 borrowers. What probability does that count state?",
          "a": "The long-run proportion of this kind of loan that is a rental: 3858/10000. The probability is the count in the category over the count of loans."
        },
        {
          "q": "A test is called 99% accurate. What is that number a count of?",
          "a": "How often the test is right across people, a long-run rate. It is not the chance that this positive person has the condition. That second quantity still needs the base rate."
        },
        {
          "q": "What fails if a long-run rate is read as one person's updated chance?",
          "a": "The base-rate comparison never happens. Wikipedia's false-positive paradox and Hoffrage's hemoccult example both turn on that swap: the accuracy rate is not the positive predictive value."
        }
      ],
      "sources": [
        {
          "t": "Diez, Çetinkaya-Rundel, and Barr, OpenIntro Statistics, 4th ed., Chapter 3 (2019)",
          "u": "https://www.openintro.org/book/os/"
        },
        {
          "t": "Hoffrage, Krauss, Martignon, and Gigerenzer, Natural frequencies improve Bayesian reasoning (2015)",
          "u": "https://doi.org/10.3389/fpsyg.2015.01473"
        },
        {
          "t": "Wikipedia contributors, Base rate fallacy (CC BY-SA 4.0)",
          "u": "https://en.wikipedia.org/wiki/Base_rate_fallacy"
        }
      ]
    },
    {
      "id": "degree-of-belief",
      "phase": 0,
      "label": "Degree of belief",
      "desc": "The other reading of probability is how strongly you believe a proposition, given what you know. Laplace ties the number to ignorance as well as to the case count.",
      "outline": [
        "State the proposition you are unsure about",
        "List what you already know, because the degree of belief is relative to that",
        "Allow two people with different knowledge to assign different degrees",
        "Expect the number to move when a new fact arrives"
      ],
      "ideas": [
        "Laplace: probability is relative in part to ignorance and in part to knowledge",
        "Mandel: a prior is a personal probability given everything known before the new evidence",
        "Two coherent people can differ before the evidence and still update by the same rule"
      ],
      "questions": [
        {
          "q": "What does Laplace say a probability is relative to?",
          "a": "In part to our ignorance, and in part to our knowledge. It is not a property of the coin alone."
        },
        {
          "q": "Mandel refuses to equate a prior with the printed base rate. What is the prior instead?",
          "a": "One's personal probability of the hypothesis given all that is known before the new evidence. A published base rate is one candidate for that knowledge, not the definition."
        },
        {
          "q": "What fails if a degree of belief is treated as a fact about the test kit?",
          "a": "The printed accuracy and the belief about the person get swapped. The accuracy describes the test's long-run behavior. The degree of belief is about the hypothesis, and it is what the evidence is supposed to move."
        }
      ],

// ---------- topological levels ----------
const LEVEL={};DATA.nodes.forEach(n=>LEVEL[n.id]=0);
let changed=true,levelGuard=0;
while(changed&&levelGuard++<=DATA.nodes.length+1){
  changed=false;
  for(const e of DATA.edges){
    if(LEVEL[e.to]<LEVEL[e.from]+1){LEVEL[e.to]=LEVEL[e.from]+1;changed=true;}
  }
}
const MAXL=Math.max(...Object.values(LEVEL));
const NLEVELS=MAXL+1;
if(changed)console.error("WARNING: cycle detected in edges — prerequisite graph is not a DAG; level layout is truncated. Run the validator.");
// Layout uses the computed longest-path levels as-is. Do not invent skip-level
// edges here — the validator requires every DATA edge to be adjacent (k → k+1).
DATA.edges.forEach(e=>{
  const span=LEVEL[e.to]-LEVEL[e.from];
  if(span!==1)console.error("WARNING: non-adjacent edge",e.from,"->",e.to,"span",span,"— drop, bridge, or demote to see-also; do not redraw it as a long diagonal.");
});

// depth color scale: early → late
const ANCHORS=(typeof THEME!=="undefined"&&THEME.anchors&&THEME.anchors.length>=2)?THEME.anchors:["#1e3a8a","#2563eb","#0d9488","#16a34a","#ca8a04","#eab308"]; // depth ramp — set in MAP-THEME
function hex2rgb(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));}
function rgb2hex(r){return "#"+r.map(v=>v.toString(16).padStart(2,"0")).join("");}
function levelColor(l){
  const t=MAXL?l/MAXL:0,seg=t*(ANCHORS.length-1);
  const i=Math.min(Math.floor(seg),ANCHORS.length-2),f=seg-i;
  const a=hex2rgb(ANCHORS[i]),b=hex2rgb(ANCHORS[i+1]);
  return rgb2hex(a.map((v,k)=>Math.round(v+(b[k]-v)*f)));
}
const LCOL=Array.from({length:NLEVELS},(_,l)=>levelColor(l));
const LUM=h=>{const a=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]};

function wrapLabel(t){

  for(const w of words){const cand=cur?cur+" "+w:w;if(cand.length<=max||!cur){cur=cand;}else{lines.push(cur);cur=w;}}

// ---------- layout: columns = topological levels ----------
const NODE_W=200,NODE_H=52,GAP_Y=16,GAP_X=74,TOP=64,LEFT=56,MAX_PER_COL=8;
const cols=[];
for(let l=0;l<NLEVELS;l++){
  const ids=DATA.nodes.filter(n=>LEVEL[n.id]===l).map(n=>n.id);
  for(let i=0;i<ids.length;i+=MAX_PER_COL)cols.push({level:l,ids:ids.slice(i,i+MAX_PER_COL),cont:i>0});
}
let cx=LEFT;cols.forEach(c=>{c.x=cx;cx+=NODE_W+GAP_X;});
const pos={};
function assignY(){cols.forEach(c=>c.ids.forEach((id,i)=>{pos[id]={x:c.x,y:TOP+i*(NODE_H+GAP_Y)};}));}
assignY();
function barycenterPass(dir){
  const seq=dir>0?cols:[...cols].reverse();
  seq.forEach((c,ci)=>{
    const skip=dir>0?ci===0:ci===cols.length-1;
    if(skip)return;
    const scored=c.ids.map((id,idx)=>{
      let sum=0,cnt=0;
      for(const e of DATA.edges){
        let other=null;
        if(e.from===id)other=e.to;else if(e.to===id)other=e.from;else continue;
        const p2=pos[other];if(!p2)continue;
        sum+=p2.y+NODE_H/2;cnt++;
      }
      return{id,idx,score:cnt?sum/cnt:pos[id].y+NODE_H/2};
    });
    scored.sort((a,b)=>a.score-b.score||a.idx-b.idx);
    c.ids=scored.map(s=>s.id);
  });
  assignY();
}
for(let i=0;i<6;i++)barycenterPass(i%2===0?1:-1);
// The entry flag is drawn 16px above its node. If the entry is not the first
// card in its column, that flag lands on the card above. Open a gap so it doesn't.
if(hasLearnerData()){
  const entry=learnerEntryId();
  const col=cols.find(c=>c.ids.includes(entry));
  if(col){
    const idx=col.ids.indexOf(entry);
    if(idx>0){for(let i=idx;i<col.ids.length;i++)pos[col.ids[i]].y+=20;}
  }
}
let maxX=0,maxY=0;
cols.forEach(c=>{maxX=Math.max(maxX,c.x+NODE_W);});
Object.values(pos).forEach(p=>{maxY=Math.max(maxY,p.y+NODE_H);});

DATA.edges.forEach((e,i)=>{
  const a=pos[e.from],b=pos[e.to];
  const x1=a.x+NODE_W,y1=a.y+NODE_H/2,x2=b.x,y2=b.y+NODE_H/2;

  g.appendChild(line);g.appendChild(arrow);g.appendChild(hit);

DATA.nodes.forEach(n=>{

function applyView(){gRoot.setAttribute("transform",`translate(${view.x},${view.y}) scale(${view.k})`);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function zoomAt(px,py,f){
  const k2=clamp(view.k*f,0.18,3.2),r=k2/view.k;
  view.x=px-(px-view.x)*r;view.y=py-(py-view.y)*r;view.k=k2;applyView();
}
svg.addEventListener("wheel",e=>{
  e.preventDefault();viewTouched=true;
  const rect=svg.getBoundingClientRect();

const pointers=new Map();
let panning=false,panStart=null,dragMoved=false,pinch0=null;
function pointerXY(e){return {cx:e.clientX,cy:e.clientY};}
function pinchState(){
  const pts=[...pointers.values()];
  if(pts.length<2)return null;
  const rect=svg.getBoundingClientRect();
  return {
    dist:Math.hypot(pts[0].cx-pts[1].cx,pts[0].cy-pts[1].cy),
    midX:(pts[0].cx+pts[1].cx)/2-rect.left,
    midY:(pts[0].cy+pts[1].cy)/2-rect.top
  };
}
function applyPinch(){
  const now=pinchState();
  if(!now||!pinch0)return;
  const k2=clamp(pinch0.k*(now.dist/Math.max(8,pinch0.dist)),0.18,3.2);
  const r=k2/pinch0.k;
  view.k=k2;
  view.x=now.midX-(pinch0.midX-pinch0.vx)*r;
  view.y=now.midY-(pinch0.midY-pinch0.vy)*r;
  applyView();
}
svg.addEventListener("pointerdown",e=>{
  pointers.set(e.pointerId,pointerXY(e));
  if(pointers.size>=2){
    const p=pinchState();
    pinch0=p?{...p,vx:view.x,vy:view.y,k:view.k}:null;
    panning=false;dragMoved=true;viewTouched=true;
    svg.classList.add("panning");
    return;
  }
  panning=true;dragMoved=false;panStart={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};
  svg.classList.add("panning");
});
window.addEventListener("pointermove",e=>{
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,pointerXY(e));
  if(pinch0&&pointers.size>=2){applyPinch();return;}
  if(!panning)return;
  const dx=e.clientX-panStart.x,dy=e.clientY-panStart.y;
  if(Math.abs(dx)+Math.abs(dy)>(usesTouchCopy()?14:4)){dragMoved=true;viewTouched=true;}
  if(!dragMoved)return;
  view.x=panStart.vx+dx;view.y=panStart.vy+dy;applyView();
});
function endPan(e){
  if(e&&e.pointerId!=null)pointers.delete(e.pointerId);
  if(pointers.size<2)pinch0=null;
  if(pointers.size===1){
    const leftover=[...pointers.values()][0];
    panning=true;panStart={x:leftover.cx,y:leftover.cy,vx:view.x,vy:view.y};
  }
  if(pointers.size===0){panning=false;svg.classList.remove("panning");}
  setTimeout(()=>{if(pointers.size===0)dragMoved=false;},0);
}
// selection/activation on pointerup: setPointerCapture-free, so the event target is the real element
svg.addEventListener("pointerup",e=>{
  if(dragMoved||pinch0){endPan(e);return;}
  const t=e.target;
  const ng=t.closest?t.closest("g.node"):null;
  const eg=t.closest?t.closest("g.edge"):null;
  if(ng)select(ng.dataset.id);
  else if(eg)onEdgeActivate(+eg.dataset.i,e);
  else{clearSel();unpinTT();}
  endPan(e);
});
svg.addEventListener("pointercancel",endPan);

function fit(){
  const rect=svg.getBoundingClientRect();
  if(isNarrow()){
    // Readable first paint: keep node labels at engine size and start at the
    // entry columns. Pinch/drag still reach the rest of the graph.
    view.k=1;
    const entry=learnerEntryId();
    if(entry&&pos[entry]){
      view.x=16-pos[entry].x+8;
      view.y=Math.max(20,rect.height/2-(pos[entry].y+NODE_H/2));
    }else{
      view.x=16;
      view.y=Math.max(20,(rect.height-(maxY+TOP))/2);
    }
    applyView();
    return;
  }
  const s=Math.min(rect.width/(maxX+LEFT),rect.height/(maxY+TOP))*0.96;
  view.k=clamp(s,0.18,1.4);
  view.x=(rect.width-(maxX+LEFT)*view.k)/2;view.y=(rect.height-(maxY+TOP)*view.k)/2;
  applyView();
  const entry=learnerEntryId();
  if(entry&&pos[entry]){
    view.k=clamp(Math.max(view.k,0.92),0.18,1.4);
    centerOn(entry);
  }
}

// ---------- focus / selection ----------
function applyFocus(related,keepEdges){
  svg.classList.add("dimmed");
  for(const id in nodeEls){nodeEls[id].classList.toggle("related",related.has(id));}
  colEls.forEach(r=>r.classList.add("related"));
  svg.querySelectorAll(".collabel").forEach(t=>t.classList.add("related"));
  edgeEls.forEach((g,i)=>{
    const rel=keepEdges.has(i);
    g.classList.toggle("related",rel);
    const e=DATA.edges[i];
    g.classList.toggle("direct",rel&&(e.from===state.sel||e.to===state.sel));
  });
}
function clearSel(){
  state.sel=null;
  svg.classList.remove("dimmed");
  Object.values(nodeEls).forEach(g=>{g.classList.remove("related");g.classList.remove("sel");g.classList.remove("match");});
  edgeEls.forEach(g=>{g.classList.remove("related");g.classList.remove("direct");});
  renderDefaultPanel();
  if(isNarrow())setPanelOpen(!!guidePinned);
}
function select(id){
  state.sel=id;guidePinned=false;unpinTT();closeHeaderChrome();
  if(isNarrow())legend.classList.remove("is-open");
  const anc=new Set([id]),keepEdges=new Set(),stack=[id];
  while(stack.length){
    const cur=stack.pop();
    DATA.edges.forEach((e,i)=>{
      if(e.to===cur&&!anc.has(e.from)){anc.add(e.from);keepEdges.add(i);stack.push(e.from);}
    });
  }
  const related=new Set(anc);
  DATA.edges.forEach(e=>{if(e.from===id)related.add(e.to);});
  DATA.edges.forEach((e,i)=>{if(e.from===id)keepEdges.add(i);});
  Object.values(nodeEls).forEach(g=>g.classList.remove("sel"));
  nodeEls[id].classList.add("sel");
  applyFocus(related,keepEdges);
  renderNodePanel(id,anc.size-1);
  if(isNarrow())setPanelOpen(true);
}
function focusTheme(ti){
  state.sel=null;unpinTT();
  const related=new Set(DATA.nodes.filter(n=>n.phase===ti).map(n=>n.id));
  const keepEdges=new Set();
  DATA.edges.forEach((e,i)=>{if(related.has(e.from)||related.has(e.to))keepEdges.add(i);});
  svg.classList.add("dimmed");
  for(const id in nodeEls)nodeEls[id].classList.toggle("related",related.has(id));
  colEls.forEach(r=>r.classList.add("related"));
  edgeEls.forEach((g,i)=>g.classList.toggle("related",keepEdges.has(i)));
  renderThemePanel(ti);
}
function focusLevel(l){
  state.sel=null;unpinTT();
  const related=new Set(DATA.nodes.filter(n=>LEVEL[n.id]===l).map(n=>n.id));
  const keepEdges=new Set();
  DATA.edges.forEach((e,i)=>{if(related.has(e.from)||related.has(e.to))keepEdges.add(i);});
  svg.classList.add("dimmed");
  for(const id in nodeEls)nodeEls[id].classList.toggle("related",related.has(id));
  colEls.forEach(r=>r.classList.add("related"));
  edgeEls.forEach((g,i)=>g.classList.toggle("related",keepEdges.has(i)));
  renderLevelPanel(l);
}

}
function hideTT(){if(pinnedEdge===null)tt.style.display="none";}
function unpinTT(){pinnedEdge=null;tt.style.display="none";edgeEls.forEach(g=>g.classList.remove("hov"));if(typeof syncScrim==="function")syncScrim();}
function edgeHTML(i){
  const e=DATA.edges[i];
  return `<div class="who">${nodeLabel(e.from)} <span class="arrow">→</span> ${nodeLabel(e.to)}</div><div>${e.why}</div>`;
}
function onEdgeEnter(i,ev){if(dragMoved||usesTouchCopy())return;edgeEls[i].classList.add("hov");if(pinnedEdge===null)showTT(edgeHTML(i),ev.clientX,ev.clientY);}
function onEdgeMove(ev){if(pinnedEdge!==null||usesTouchCopy())return;showTT(tt.innerHTML,ev.clientX,ev.clientY);}
function onEdgeLeave(i){if(usesTouchCopy())return;edgeEls[i].classList.remove("hov");if(pinnedEdge!==i)hideTT();}
function onEdgeActivate(i,ev){
  if(pinnedEdge===i){unpinTT();syncScrim();return;}
  pinnedEdge=i;edgeEls.forEach(g=>g.classList.remove("hov"));edgeEls[i].classList.add("hov");
  if(isNarrow()){legend.classList.remove("is-open");setPanelOpen(false);}
  showTT(edgeHTML(i),ev.clientX,ev.clientY);
}

// ---------- panel ----------
const panel=$("#panel");
function themeChip(ti){return `<span class="chip" style="background:${THEMES[ti].color}">${THEMES[ti].name}</span>`;}
function levelChip(l){const c=LCOL[l];return `<span class="chip" style="background:${c}${LUM(c)>0.28?";color:var(--ink)":""}">Level ${l}</span>`;}
function depBlock(dir,e){
  const other=dir==="req"?e.from:e.to;
  return `<div class="dep"><b data-goto="${other}">${dir==="req"?"← ":"→ "}${nodeLabel(other)}</b><p>${e.why}</p></div>`;
}
function gotoHandler(){
  panel.querySelectorAll("[data-goto]").forEach(b=>{
    if(b.dataset.goto==="__back")return;
    b.addEventListener("click",()=>{select(b.dataset.goto);centerOn(b.dataset.goto);});
  });
}
function bindBack(){
  panel.querySelectorAll("[data-goto='__back']").forEach(el=>{
    el.addEventListener("click",()=>{guidePinned=false;clearSel();});
  });
}
function sheetChrome(title){
  return `<div class="sheet-handle"></div><div class="sheet-head narrow-only"><strong>${title}</strong><button type="button" class="sheet-close" data-goto="__back">Close</button></div>`;
}
function renderNodePanel(id,ancCount){
  const n=nodeById(id);
  const reqs=DATA.edges.filter(e=>e.to===id).sort((a,b)=>LEVEL[a.from]-LEVEL[b.from]);
  const unl=DATA.edges.filter(e=>e.from===id).sort((a,b)=>LEVEL[a.to]-LEVEL[b.to]);
  let h=`${sheetChrome(n.label)}<span class="backlink" data-goto="__back">← overview</span><br>
  ${levelChip(LEVEL[id])} ${themeChip(n.phase)}
  ${n.id===learnerEntryId()?`<p class="here-summary" style="margin-top:10px">Where you're starting.</p>`:learnerStateOf(n)==="known"?`<p style="color:var(--muted);font-size:14.5px">In your comfortable set — still here if you want to review.</p>`:""}
  <h2>${n.label}</h2><p>${n.desc}</p>
  <h3>Rough outline — study in this order</h3>
  <ol class="outline">${n.outline.map(o=>`<li>${o}</li>`).join("")}</ol>
  <h3>Key ideas</h3><ul>${n.ideas.map(i=>`<li>${i}</li>`).join("")}</ul>
  <h3>Mastery check — prove you know this</h3>
  ${n.questions.map((q,i)=>`<div class="dep"><b>Q${i+1}. ${q.q}</b><details><summary>Show answer</summary><p>${q.a}</p></details></div>`).join("")}
  <h3>Study sources</h3><ul>${n.sources.map(s=>`<li>${s.u?`<a href="${s.u}" target="_blank" rel="noopener">${s.t}</a>`:s.t}</li>`).join("")}</ul>`;
  h+=`<h3>Requires — why these are prerequisites (${reqs.length})</h3>`;
  h+=reqs.length?reqs.map(e=>depBlock("req",e)).join(""):"<p style='color:var(--muted)'>Nothing — this is an entry point.</p>";
  h+=`<h3>Unlocks (${unl.length})</h3>`;
  h+=unl.length?unl.map(e=>depBlock("unl",e)).join(""):"<p style='color:var(--muted)'>Nothing directly — this is a terminal destination.</p>";
  h+=`<p style="margin-top:14px;font-size:14px;color:var(--muted)">Graph focus: this node (highlighted), its ${ancCount} transitive prerequisite${ancCount===1?"":"s"}, and its direct downstream targets.</p>`;
  panel.innerHTML=h;
  bindBack();
  gotoHandler();
}
function renderThemePanel(ti){
  const ids=DATA.nodes.filter(n=>n.phase===ti).map(n=>n.id);
  panel.innerHTML=`${sheetChrome(THEMES[ti].name)}<span class="backlink" data-goto="__back">← overview</span><br>${themeChip(ti)}
  <h2>${THEMES[ti].name}</h2>
  <p>${THEME_BLURBS[ti]||""}</p>
  <h3>Concepts in this theme (${ids.length})</h3>
  ${ids.map(i=>`<div class="dep"><b data-goto="${i}">${nodeLabel(i)}</b> <span style="font-size:14px;color:var(--muted)">Level ${LEVEL[i]}</span><p>${nodeById(i).desc}</p></div>`).join("")}`;
  bindBack();
  gotoHandler();
  if(isNarrow())setPanelOpen(true);
}
function renderLevelPanel(l){
  const ids=DATA.nodes.filter(n=>LEVEL[n.id]===l).map(n=>n.id);
  panel.innerHTML=`${sheetChrome("Level "+l)}<span class="backlink" data-goto="__back">← overview</span><br>${levelChip(l)}
  <h2>Level ${l}</h2>
  <p>Everything on this level can be studied in parallel: nothing here depends on anything else at the same level, and every prerequisite sits strictly to the left.</p>
  <h3>Concepts at this level (${ids.length})</h3>
  ${ids.map(i=>`<div class="dep"><b data-goto="${i}">${nodeLabel(i)}</b> <span style="font-size:14px;color:var(--muted)">${THEMES[nodeById(i).phase].name}</span><p>${nodeById(i).desc}</p></div>`).join("")}`;
  bindBack();
  gotoHandler();
  if(isNarrow())setPanelOpen(true);
}
function renderDefaultPanel(){
  const nodeVerb=usesTouchCopy()?"Tap":"Click";
  const arrowLine=usesTouchCopy()
    ?"Tap any <b>arrow</b> for its rationale (tap again to dismiss). Drag to pan, pinch to zoom, search to jump."
    :"Hover or click any <b>arrow</b> for its rationale (click again to pin). Drag to pan, scroll to zoom, search to jump.";
  const colorLine=usesTouchCopy()
    ?"the tint deepens from the entry level at the left to the frontier at the right — the theme's depth ramp, also drawn in the Levels sheet (tap a band to focus that level)."
    :"the tint deepens from the entry level at the left to the frontier at the right — the theme's depth ramp, also drawn as the legend bar bottom-left (click a band to focus that level).";
  const startHTML=hasLearnerData()?(function(){
    const entry=learnerEntryId();
    const note=learnerNote()||"Where you're starting is marked on the map. Quieter nodes are ones you already reported as comfortable — they're still here if you want to review.";
    const jump=entry?`<p><b class="here-jump" data-goto="${entry}">Start here: ${nodeLabel(entry)}</b></p>`:"";
    return `<div class="here-summary" id="learner-start"><h3>Your starting point</h3><p>${note}</p>${jump}</div>`;
  })():"";
  panel.innerHTML=`${sheetChrome("How to read this map")}
  <h2 style="margin-top:0">Concept dependency map</h2>
  <p>This map lays out the ${DATA.nodes.length} concepts between ${hasLearnerData()?"where you're starting":"zero background"} and the end goal: <b>${GOAL_STATEMENT}</b></p>
  ${startHTML}
  <h3>How to read it</h3>
  <ul>
    <li><b>Columns are topological levels.</b> An arrow A → B means learn A before B, so B always sits to the right of A. Everything in one column can be learned in parallel once the columns to its left are done.</li>
    <li><b>Color encodes depth:</b> ${colorLine}</li>
    <li>${nodeVerb} any <b>node</b> for its description, a <b>rough study outline</b> (ordered steps), key ideas, sources, and — for every arrow touching it — <b>why</b> that prerequisite holds.</li>
    <li>${nodeVerb === "Tap" ? "Tapping" : "Clicking"} a node also lights up its entire prerequisite chain: what you'd need to study, in the graph's own order.</li>
    <li>${arrowLine}</li>
  </ul>
  <h3>A suggested path through the graph</h3>
  <ul>
    ${SUGGESTED_PATH.map(s=>`<li><b>${s.h}:</b> ${s.t}</li>`).join("")}
  </ul>
  <h3>Themes</h3>
  <div>${THEMES.map((p,i)=>`<span class="chipbtn" data-phase="${i}" style="margin:2px"><span class="dot" style="background:${p.color}"></span>${p.name}</span>`).join("")}</div>
  <p style="font-size:14px;color:var(--muted)">${nodeVerb} a theme to highlight its nodes across the graph.</p>
  <h3>Sources</h3>
  <p style="font-size:14.5px">${GOAL_SOURCES_NOTE}</p>`;
  bindBack();
  gotoHandler();
  panel.querySelectorAll("[data-phase]").forEach(b=>{
    b.addEventListener("click",()=>focusTheme(+b.dataset.phase));
  });
}

// ---------- search ----------
const searchInput=$("#search"),results=$("#results");
searchInput.addEventListener("input",()=>{
  const q=searchInput.value.trim().toLowerCase();
  if(!q){results.style.display="none";return;}
  const matches=DATA.nodes.filter(n=>
    n.label.toLowerCase().includes(q)||n.desc.toLowerCase().includes(q)||n.ideas.some(i=>i.toLowerCase().includes(q))||n.outline.some(o=>o.toLowerCase().includes(q))
  ).slice(0,8);
  results.innerHTML=matches.map(n=>`<div data-id="${n.id}">${n.label}<span class="rphase">${THEMES[n.phase].name}</span></div>`).join("")||"<div><i>No matches</i></div>";
  results.style.display="block";
  results.querySelectorAll("[data-id]").forEach(r=>{
    r.addEventListener("click",()=>{
      Object.values(nodeEls).forEach(g=>g.classList.remove("match"));
      nodeEls[r.dataset.id].classList.add("match");
      select(r.dataset.id);centerOn(r.dataset.id);
      results.style.display="none";searchInput.value="";
    });
  });
});
document.addEventListener("click",e=>{if(!e.target.closest(".searchwrap"))results.style.display="none";});
function centerOn(id){
  const p=pos[id],rect=svg.getBoundingClientRect();
  const cxg=p.x+NODE_W/2,cyg=p.y+NODE_H/2;
  view.x=rect.width/2-cxg*view.k;view.y=rect.height/2-cyg*view.k;applyView();
}

// ---------- legend & init ----------
const legend=$("#legend");
(function buildLegend(){
  const stops=LCOL.map((c,i)=>`${c} ${Math.round(100*i/(NLEVELS-1))}%`).join(", ");
  const bandVerb=usesTouchCopy()?"Tap":"Click";
  legend.innerHTML=`<div class="sheet-handle"></div>
  <div class="sheet-head narrow-only"><strong>Topological levels</strong><button type="button" class="sheet-close" id="btn-legend-close">Close</button></div>
  <div class="bar" style="background:linear-gradient(90deg, ${stops})"></div>
  <div class="barlabels"><span>0</span><span>topological level →</span><span>${MAXL}</span></div>
  <div class="cap">Every column is a dependency level: all its prerequisites sit strictly to the left, so a level can be studied in parallel. ${bandVerb} a band below to focus it.</div>
  <div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:5px">${LCOL.map((c,i)=>`<span class="chipbtn lvlchip" data-level="${i}" style="border-color:${c};font-size:14px;padding:1px 6px">${i}</span>`).join("")}</div>`;
  legend.querySelectorAll(".lvlchip").forEach(b=>b.addEventListener("click",()=>{
    if(isNarrow()){legend.classList.remove("is-open");$("#btn-legend").setAttribute("aria-expanded","false");}
    focusLevel(+b.dataset.level);
  }));
  const close=$("#btn-legend-close");if(close)close.addEventListener("click",()=>{legend.classList.remove("is-open");$("#btn-legend").setAttribute("aria-expanded","false");syncScrim();});
})();
$("#stats").textContent=`${DATA.nodes.length} concepts · ${DATA.edges.length} prerequisite links · ${NLEVELS} topological levels · build ${BUILD}`;
$("#hint").innerHTML=hintCopy();
renderDefaultPanel();
if(!isNarrow())panel.classList.add("is-open");
fit();

// ---------- theme toggle (engine): Themed ↔ Default, re-skins palette, fonts, and the depth ramp live ----------
const ANCHORS_THEMED=ANCHORS.slice();
let themedOn=true;
function recolorGraph(){
  LCOL.length=0;LCOL.push(...Array.from({length:NLEVELS},(_,l)=>levelColor(l)));
  cols.forEach((c,i)=>colEls[i].setAttribute("fill",LCOL[c.level]));
  svg.querySelectorAll(".collabel").forEach(t=>t.setAttribute("fill",LCOL[+t.dataset.level]));
  for(const id in nodeEls){const c=LCOL[LEVEL[id]],rc=nodeEls[id].querySelector("rect.main");rc.setAttribute("fill",c);rc.setAttribute("stroke",c);}
  const stops=LCOL.map((c,i)=>`${c} ${Math.round(100*i/(NLEVELS-1))}%`).join(", ");
  const bar=legend.querySelector(".bar");if(bar)bar.style.background=`linear-gradient(90deg, ${stops})`;
  legend.querySelectorAll(".lvlchip").forEach(b=>b.style.borderColor=LCOL[+b.dataset.level]);
}
function setTheme(on){
  themedOn=on;
  const t=on?THEME:THEME_DEFAULT;
  applyTheme(t);
  const ramp=on?ANCHORS_THEMED:THEME_DEFAULT.anchors;
  if(ramp&&ramp.length>=2){ANCHORS.length=0;ANCHORS.push(...ramp);}
  recolorGraph();
  $("#btn-theme").textContent=on?"Themed":"Default";
}
$("#btn-theme").addEventListener("click",()=>setTheme(!themedOn));
// deep link: open with #node-id to start with that concept selected
(function(){
  const id=location.hash&&location.hash.slice(1);
  if(id&&nodeEls[id]){select(id);centerOn(id);}
})();
</script>
</body>
</html>
