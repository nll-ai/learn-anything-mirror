<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multi-agent research → comparisons you can trust · Prerequisite Map</title>
<style>
  :root{
    --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; --panel:#ffffff;
    --accent:#2563eb;
    /* engine defaults — the MAP-THEME block in the page's script overrides all of these at startup */
    --ink-2:#334155; --dep-bg:#fbfdff; --edge:#bcc7d4; --edge-related:#7c8aa0;
    --hover-bg:#eff6ff; --match:#f59e0b; --btn-hover-border:#94a3b8;
    --overlay-bg:rgba(255,255,255,.92); --overlay-bg-2:rgba(255,255,255,.85);
    --font-display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --safe-t:env(safe-area-inset-top,0px); --safe-r:env(safe-area-inset-right,0px);
    --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px);
  }
  *{box-sizing:border-box}
  html,body{height:100%;height:100dvh;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{font-family:var(--font-body);color:var(--ink);background:var(--bg);display:flex;flex-direction:column;max-width:100%}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;padding-left:max(16px,var(--safe-l));padding-right:max(16px,var(--safe-r));padding-top:max(10px,var(--safe-t));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:30}
  .brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;min-width:0}
  header h1{font-size:17px;margin:0;font-weight:650;font-family:var(--font-display)}
  header .stats{font-size:14px;color:var(--muted)}
  .spacer{flex:1}
  .toolbar{display:flex;align-items:center;gap:8px}
  .toolbar-actions{display:flex;align-items:center;gap:8px}
  @media (min-width:901px){
    .brand,.toolbar,.toolbar-actions{display:contents}
  }
  .searchwrap{position:relative}
  #search{width:230px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:15px;outline:none;background:var(--panel);color:var(--ink)}
  #search:focus{border-color:var(--accent)}
  #results{position:absolute;top:36px;left:0;width:300px;max-height:260px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.12);display:none;z-index:50}
  #results div{padding:7px 10px;font-size:15px;cursor:pointer}
  #results div:hover{background:var(--hover-bg)}
  #results .rphase{color:var(--muted);font-size:14px;margin-left:6px}
  button{padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:15px;cursor:pointer;color:var(--ink)}
  button:hover{border-color:var(--btn-hover-border)}
  .iconbtn{display:none;align-items:center;justify-content:center;width:44px;height:44px;padding:0;flex-shrink:0}
  .iconbtn svg{display:block}
  .narrow-only{display:none}
  main{flex:1;display:flex;min-height:0;min-width:0}
  #canvaswrap{flex:1;position:relative;overflow:hidden;min-width:0;min-height:0}
  #graph{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
  #graph.panning{cursor:grabbing}
  #legend{position:absolute;left:12px;bottom:12px;background:var(--overlay-bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;max-width:340px;z-index:20}
  #legend .bar{height:10px;border-radius:5px}
  #legend .barlabels{display:flex;justify-content:space-between;margin-top:3px;color:var(--muted)}
  #legend .cap{margin-top:4px;color:var(--muted);line-height:1.4}
  .sheet-head{display:none;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
  .sheet-head strong{font-size:15px;font-family:var(--font-display)}
  .sheet-handle{display:none;width:36px;height:4px;border-radius:999px;background:var(--line);margin:0 auto 10px}
  .sheet-close{min-height:44px;padding:8px 12px}
  #hint{position:absolute;left:12px;top:12px;font-size:14px;color:var(--muted);background:var(--overlay-bg-2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;z-index:20}
  #tt{position:absolute;display:none;max-width:330px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.18);padding:10px 12px;font-size:14.5px;z-index:40;pointer-events:none;line-height:1.45}
  #tt .who{font-weight:650;font-size:14px;margin-bottom:4px}
  #tt .who .arrow{color:var(--accent)}
  #panel{width:400px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:18px 20px 40px}
  #panel h2{font-size:19px;margin:6px 0 6px;line-height:1.3;font-family:var(--font-display)}
  #panel h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
  #panel p{font-size:15px;line-height:1.55;margin:6px 0}
  #panel ul,#panel ol{margin:4px 0;padding-left:20px}
  #panel li{font-size:15px;line-height:1.5;margin:3px 0}
  #panel ol.outline li{margin:6px 0}
  #panel ol.outline li::marker{color:var(--muted);font-weight:650;font-size:14px}
  #panel details{margin-top:6px}
  #panel summary{cursor:pointer;color:var(--accent);font-size:14px}
  #panel details p{margin:6px 0 2px;font-size:14.5px;color:var(--ink-2)}
  #panel .chip{display:inline-block;font-size:14px;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:999px;color:#fff}
  .dep{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:8px 0;background:var(--dep-bg)}
  .dep b{font-size:15px;cursor:pointer;color:var(--accent)}
  .dep b:hover{text-decoration:underline}
  .dep p{margin:4px 0 2px;font-size:14.5px;color:var(--ink-2)}
  #panel a{color:var(--accent);text-decoration:none;font-size:15px}
  #panel a:hover{text-decoration:underline}
  .backlink{font-size:14.5px;color:var(--accent);cursor:pointer}
  .backlink:hover{text-decoration:underline}
  #scrim{display:none}
  .colbg{opacity:.05}
  .collabel{font-size:14px;font-weight:650;filter:brightness(.62) saturate(1.15)}
  .node rect.main{stroke-width:1.3;cursor:pointer}
  .node text{font-size:14px;fill:var(--ink);pointer-events:none;font-weight:520}
  .node{cursor:pointer}
  .edge path.line{stroke:var(--edge);stroke-width:1.3;fill:none;transition:stroke-width .1s}
  .edge polygon{fill:var(--edge)}
  .edge path.hit{stroke:transparent;stroke-width:16;fill:none;pointer-events:stroke;cursor:pointer}
  svg.dimmed .node:not(.related){opacity:.13}
  svg.dimmed .edge:not(.related){opacity:.05}
  svg.dimmed .colbg{opacity:.02}
  svg.dimmed .collabel:not(.related){opacity:.2}
  .edge.related path.line{stroke:var(--edge-related);stroke-width:1.7}
  .edge.related polygon{fill:var(--edge-related)}
  .edge.direct path.line{stroke:var(--accent);stroke-width:2.1}
  .edge.direct polygon{fill:var(--accent)}
  .edge.hov path.line{stroke:var(--accent);stroke-width:2.6}
  .edge.hov polygon{fill:var(--accent)}
  .node.related rect.main{stroke-width:2.2}
  .node.sel rect.main{stroke-width:2.8}
  .node.match rect.main{stroke:var(--match);stroke-width:2.6}
  .node.learner-known rect.main{fill-opacity:0.08;stroke-opacity:0.5}
  .node.learner-frontier rect.main{stroke-width:2.35}
  .node .here-ring{fill:none;stroke:var(--accent);stroke-width:1.6;opacity:.88}
  .node .here-flag{font-size:14px;font-weight:650;fill:var(--accent)}
  .here-summary{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0 4px;background:var(--dep-bg)}
  .here-summary h3{margin-top:0}
  .here-jump{color:var(--accent);cursor:pointer}
  .here-jump:hover{text-decoration:underline}
  .chipbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:14px;font-weight:600;cursor:pointer;background:var(--panel)}
  .chipbtn:hover{border-color:var(--btn-hover-border)}
  .chipbtn .dot{width:8px;height:8px;border-radius:50%}
  @media (pointer:coarse){
    .edge path.hit{stroke-width:28}
  }
  @media (max-width:900px){
    header{z-index:70;flex-wrap:nowrap;gap:8px;padding:8px 12px;padding-left:max(12px,var(--safe-l));padding-right:max(12px,var(--safe-r));padding-top:max(8px,var(--safe-t))}
    .brand{flex:1}
    header h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    header .stats,.spacer{display:none}
    .iconbtn,.narrow-only{display:inline-flex}
    .sheet-head.narrow-only{display:flex}
    .toolbar{position:relative;flex-shrink:0}
    .searchwrap{display:none;flex:1;min-width:0}
    header.search-open .brand{display:none}
    header.search-open .searchwrap{display:block}
    header.search-open #btn-more{display:none}
    #search{width:100%;min-height:44px;font-size:16px;padding:10px 12px}
    #results{left:0;right:0;width:100%;top:calc(100% + 6px);max-height:min(50dvh,360px)}
    #results div{min-height:44px;display:flex;align-items:center;padding:10px 12px}
    .toolbar-actions{display:none;position:absolute;top:calc(100% + 6px);right:0;flex-direction:column;align-items:stretch;min-width:196px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.16);z-index:80}
    header.menu-open .toolbar-actions{display:flex}
    .toolbar-actions button{min-height:44px;width:100%;text-align:left;padding:10px 12px}
    button,.iconbtn,.chipbtn,#panel .backlink,#panel summary{min-height:44px}
    .chipbtn{padding:10px 14px}
    #hint{display:none}
    #legend{display:none;position:fixed;left:0;right:0;bottom:0;top:auto;max-width:none;max-height:min(52dvh,460px);overflow:auto;z-index:60;border-radius:16px 16px 0 0;border:1px solid var(--line);background:var(--panel);padding:12px 16px calc(16px + var(--safe-b));box-shadow:0 -8px 28px rgba(15,23,42,.16)}
    #legend.is-open{display:block}
    #legend .lvlchip{min-width:44px;min-height:44px;justify-content:center}
    #tt{position:fixed;left:0;right:0;bottom:0;top:auto;max-width:none;max-height:min(42dvh,360px);overflow:auto;pointer-events:auto;border-radius:16px 16px 0 0;padding:12px 16px calc(16px + var(--safe-b));z-index:70}
    #panel .backlink{display:inline-flex;align-items:center;min-height:44px;padding-right:8px}
    #tt .sheet-handle,#legend .sheet-handle,#panel .sheet-handle{display:block}
    button,.iconbtn{touch-action:manipulation}
    #panel,#legend,#tt{-webkit-overflow-scrolling:touch}
    #panel{position:fixed;left:0;right:0;bottom:0;width:100%;max-height:min(58dvh,520px);border-left:none;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 16px calc(18px + var(--safe-b));z-index:60;transform:translateY(110%);box-shadow:0 -8px 28px rgba(15,23,42,.16)}
    #panel.is-open{transform:translateY(0)}
    #scrim.is-on{display:block;position:fixed;inset:0;background:rgba(15,23,42,.28);z-index:45}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Multi-agent research → a comparison you can trust</h1>
    <span class="stats" id="stats"></span>
  </div>
  <div class="spacer"></div>
  <div class="toolbar">
    <button type="button" id="btn-search-toggle" class="iconbtn narrow-only" aria-label="Search concepts" aria-expanded="false" title="Search">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.25" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.2 15.2 21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="searchwrap">
      <input id="search" type="search" placeholder="Search concepts…" autocomplete="off" enterkeyhint="search">
      <div id="results"></div>
    </div>
    <div class="toolbar-actions" id="toolbar-actions">
      <button type="button" id="btn-theme" title="Toggle themed / default skin">Themed</button>
      <button type="button" id="btn-fit" title="Zoom to fit">Fit</button>
      <button type="button" id="btn-reset" title="Clear selection">Reset</button>
      <button type="button" id="btn-legend" class="narrow-only" aria-expanded="false">Levels</button>
      <button type="button" id="btn-guide" class="narrow-only" aria-expanded="false">Guide</button>
    </div>
    <button type="button" id="btn-more" class="iconbtn narrow-only" aria-label="More controls" aria-expanded="false" aria-controls="toolbar-actions" title="More">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="6" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="18" r="1.7" fill="currentColor"/></svg>
    </button>
  </div>
</header>
<main>
  <div id="canvaswrap">
    <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="hint">A → B means “learn A before B”. Hover or click any arrow to see <b>why</b> it is a prerequisite.</div>
    <div id="legend"></div>
    <div id="tt"></div>
  </div>
  <aside id="panel"></aside>
</main>
<div id="scrim" hidden></div>

<script>

{
nodes:[
{"id": "argument-structure", "phase": 0, "label": "Claims, grounds & warrants", "desc": "Toulmin’s anatomy of an argument: a claim rests on grounds (data), licensed by a warrant, qualified by how strongly it holds and by the conditions that would defeat it.", "outline": ["Separate the claim from the data offered for it", "Name the warrant: the general rule that makes the data relevant", "Add the qualifier (how sure) and rebuttal (when it fails)", "Re-read a paper’s abstract and mark each of the six parts", "Notice which part an AI summary silently drops — usually the qualifier"], "ideas": ["A claim without stated grounds cannot be checked, only believed", "Most disagreements are about warrants, not data", "Qualifiers and rebuttal conditions are where scientific claims carry their precision", "A summary that keeps claims but drops qualifiers is a different, stronger claim"], "questions": [{"q": "What are the six parts of Toulmin’s model, and which one makes data relevant to a claim?", "a": "Claim, data/grounds, warrant, backing, qualifier and rebuttal; the warrant is the inference licence that connects the data to the claim."}, {"q": "Two analysts cite the same benchmark table but reach opposite conclusions. Which element do they most likely disagree on?", "a": "The warrant — for example whether a perplexity bound is a fair proxy for sample quality — not the data itself."}, {"q": "Why is dropping a qualifier (“at 110M parameters, on OpenWebText”) a substantive change and not an edit?", "a": "The qualifier bounds the conditions under which the claim holds; removing it asserts a broader claim the grounds do not support."}], "sources": [{"t": "Toulmin, The Uses of Argument (updated ed., Cambridge UP, 2003)", "u": "https://doi.org/10.1017/CBO9780511840005"}, {"t": "Stanford Encyclopedia of Philosophy — Argument and Argumentation", "u": "https://plato.stanford.edu/entries/argument/"}]},
{"id": "operational-definitions", "phase": 0, "label": "Operational definitions", "desc": "Turning a fuzzy property (“better”, “faster”, “more principled”) into a measurement procedure — and knowing what the measurement does and does not capture.", "outline": ["Bridgman’s idea: a concept is fixed by the operations used to measure it", "Why one construct usually needs several operations", "Construct validity: does the measure track the property you mean?", "Write two operationalizations of “sample quality” and list what each misses"], "ideas": ["Every comparison word hides a measurement choice", "A single operationalization invites optimizing the metric instead of the property", "Construct validity is argued from a network of evidence, not proven by one test", "Two papers can use the same word for different operations"], "questions": [{"q": "What does it mean to operationalize a concept, and what is the main criticism of strict operationalism?", "a": "Defining it by the procedure used to measure it; strictly, each procedure then defines a different concept, so you need validity arguments linking them."}, {"q": "Paper A reports generative perplexity, paper B reports MAUVE, both claim “better samples.” What has to be established before comparing?", "a": "That both measures track the same construct of sample quality — construct validity — otherwise they answer different questions."}, {"q": "What is construct validity in Cronbach & Meehl’s sense?", "a": "The degree to which a measure behaves as the theory of the construct predicts across a network of relations, not just one correlation."}], "sources": [{"t": "Stanford Encyclopedia of Philosophy — Operationalism", "u": "https://plato.stanford.edu/entries/operationalism/"}, {"t": "Cronbach & Meehl, Construct Validity in Psychological Tests (Psychological Bulletin, 1955)", "u": "https://psychclassics.yorku.ca/Cronbach/construct.htm"}]},
{"id": "evidence-hierarchy", "phase": 0, "label": "Kinds of evidence", "desc": "Not all support is equal: a controlled ablation, a reported benchmark number, an author’s interpretation and a blog summary carry different weight, and frameworks like GRADE make that ranking explicit.", "outline": ["Primary result vs. secondary report vs. opinion", "Why design (controlled, ablated, replicated) sets the starting weight", "GRADE’s idea: start from design, then downgrade or upgrade", "Practice: label each sentence of a review by evidence type"], "ideas": ["The same number means less when quoted than when produced under a known protocol", "Replication across independent groups beats a single strong result", "Author interpretation is a claim, not evidence", "Evidence weight is a property of the claim–source pair, not the source alone"], "questions": [{"q": "What are GRADE’s four certainty levels, and what moves evidence between them?", "a": "High, moderate, low, very low; certainty is downgraded for risk of bias, inconsistency, indirectness, imprecision and publication bias, and can be upgraded for large effects."}, {"q": "A review states “MDLM beats SEDD.” What type of evidence is that sentence, and what would you need to upgrade it?", "a": "A secondary interpretation; you need the primary tables under a stated protocol, ideally reproduced or compared like-for-like."}, {"q": "Why is evidence weight attached to a claim–source pair rather than to a source?", "a": "A strong paper can weakly support a claim it only mentions in passing; the same source can be primary for one claim and hearsay for another."}], "sources": [{"t": "Guyatt et al., GRADE: an emerging consensus on rating quality of evidence and strength of recommendations (BMJ, 2008)", "u": "https://doi.org/10.1136/bmj.39489.470347.AD"}, {"t": "Cochrane Handbook, ch. 14 — Summary of findings tables and grading the certainty of the evidence", "u": "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-14"}]},
{"id": "discrete-diffusion-basics", "phase": 7, "label": "Discrete diffusion basics", "desc": "The shared skeleton of the worked example: a forward process that corrupts tokens through a Markov chain, a learned reverse model, and a variational bound as the training objective.", "outline": ["Forward corruption with transition matrices on a categorical state space", "The reverse (denoising) model and what it parameterizes", "The ELBO as training objective and as a perplexity bound", "Discrete-time vs. continuous-time (CTMC) formulations", "Sampling: ancestral steps vs. tau-leaping"], "ideas": ["Discrete diffusion replaces Gaussian noise with a Markov chain over a vocabulary", "The ELBO gives an upper bound on negative log-likelihood, so reported perplexity is a bound", "Continuous-time formulations make the step count a sampling-time choice", "Mask (absorbing) and uniform noise lead to quite different models"], "questions": [{"q": "What plays the role of Gaussian noise in discrete diffusion?", "a": "A forward Markov chain with transition matrices Q_t over the vocabulary, for example uniform resampling or jumping to an absorbing [MASK] state."}, {"q": "Why is a diffusion model’s reported perplexity not directly comparable with an autoregressive model’s?", "a": "Diffusion reports an ELBO-based upper bound on NLL while AR models report exact likelihood; the true diffusion NLL is at most the bound, so the comparison is conservative against diffusion rather than like-for-like."}, {"q": "What does moving to continuous time (CTMC) buy you?", "a": "A rate-matrix formulation in which the number of sampling steps is chosen at inference time, with tau-leaping as an approximate simulator."}], "sources": [{"t": "Austin et al., Structured Denoising Diffusion Models in Discrete State-Spaces — D3PM (NeurIPS 2021)", "u": "https://arxiv.org/abs/2107.03006"}, {"t": "Campbell et al., A Continuous Time Framework for Discrete Denoising Models (NeurIPS 2022)", "u": "https://arxiv.org/abs/2205.14987"}]},
{"id": "llm-breadth-limits", "phase": 4, "label": "Why LLMs blur landscapes", "desc": "The mechanisms behind “great on a narrow topic, falls apart on compare-and-contrast”: degraded use of long context, hallucinated specifics, and answers that merge distinct sources into one plausible blend.", "outline": ["Intrinsic vs. extrinsic hallucination", "Lost-in-the-middle: position-dependent use of context", "Context rot: accuracy falls as input grows, even on easy tasks", "Why a landscape question stresses all three at once"], "ideas": ["Breadth questions need many sources held at once — the regime where models are weakest", "Retrieved but mid-context evidence is often ignored", "A fluent synthesis can hide which source said what", "These are structural limits, so the fix is process, not better prompting"], "questions": [{"q": "What is the lost-in-the-middle effect?", "a": "Models use information best when it is at the start or end of the context and markedly worse when it sits in the middle."}, {"q": "Why does a single long chat degrade on a five-paper comparison even when every paper is pasted in?", "a": "Long inputs suffer context rot and positional neglect, so details from some papers get dropped or blended."}, {"q": "Intrinsic vs. extrinsic hallucination — which one is a citation that does not say what the model claims?", "a": "Intrinsic if the cited source contradicts the claim; extrinsic if the source is silent and cannot verify it."}], "sources": [{"t": "Liu et al., Lost in the Middle: How Language Models Use Long Contexts (TACL 2024)", "u": "https://arxiv.org/abs/2307.03172"}, {"t": "Chroma Research, Context Rot: How Increasing Input Tokens Impacts LLM Performance (2025)", "u": "https://www.trychroma.com/research/context-rot"}, {"t": "Ji et al., Survey of Hallucination in Natural Language Generation (ACM Computing Surveys, 2023)", "u": "https://arxiv.org/abs/2202.03629"}]},
{"id": "harness-basics", "phase": 4, "label": "Agent harness basics", "desc": "What a harness like Claude Code or Codex is: a model in a loop with tools, a context window, project instructions (AGENTS.md / CLAUDE.md) and permission settings.", "outline": ["The agent loop: model → tool call → observation → model", "What lives in context: system prompt, project instructions, tool results", "Project instruction files (AGENTS.md / CLAUDE.md)", "Permissions and approval modes", "Where subagents and skills plug in (preview)"], "ideas": ["You configure behaviour through instructions, tools and permissions — not code", "Everything a model knows mid-task is what is in its context window", "Project files make instructions persistent and reviewable", "Permissions are the first security boundary"], "questions": [{"q": "What are the moving parts of an agent harness?", "a": "A model running in a loop that calls tools, reads observations back into a context window, guided by system and project instructions and gated by permissions."}, {"q": "What is AGENTS.md for?", "a": "A repository file giving coding agents persistent project instructions — conventions, commands, constraints — that the harness loads into context."}, {"q": "Why does it matter that each turn only sees the context window?", "a": "Anything not in context — earlier findings, a rubric, a source — does not exist for the model, so design what goes into context deliberately."}], "sources": [{"t": "AGENTS.md — an open format for guiding coding agents", "u": "https://agents.md/"}, {"t": "Claude Code docs — Security (permissions, prompt-injection safeguards)", "u": "https://code.claude.com/docs/en/security"}, {"t": "Anthropic, Building effective agents (2024)", "u": "https://www.anthropic.com/engineering/building-effective-agents"}]},
{"id": "precise-question", "phase": 0, "label": "State the question precisely", "desc": "Writing a compare-and-contrast question so it has an answer: which approaches, compared on which properties, under which conditions, for which decision.", "outline": ["Name the decision the comparison serves", "Fix the population: which methods, versions and papers are in", "Fix conditions: scale, data, compute, metric family", "Phrase it in a PICO-like frame (population, intervention, comparator, outcome)", "Write what would count as an answer before searching"], "ideas": ["A landscape question with no stated decision has no stopping rule", "Scope boundaries are part of the question, not housekeeping", "If you cannot say what the answer would look like, the agents cannot either", "Precision here is what later makes rubrics writable"], "questions": [{"q": "Rewrite “How do D3PM, SEDD and MDLM compare?” as a precise question.", "a": "For example: on LM1B — the benchmark where MDLM tabulates D3PM-absorb, SEDD and MDLM together — how do they compare on test-perplexity bound at stated parameters and training tokens, and on objective and recipe, to decide which to reimplement?"}, {"q": "What does PICO stand for, and why borrow it from systematic reviews?", "a": "Population, Intervention, Comparator, Outcome; it forces every element of the question to be explicit before evidence is gathered."}, {"q": "What goes wrong downstream if the question omits conditions such as scale or tokenizer?", "a": "Agents collect numbers from incomparable settings and the comparison silently mixes regimes."}], "sources": [{"t": "Cochrane Handbook, ch. 2 — Determining the scope of the review and the questions it will address", "u": "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-02"}, {"t": "Toulmin, The Uses of Argument (updated ed., Cambridge UP, 2003)", "u": "https://doi.org/10.1017/CBO9780511840005"}]},
{"id": "comparison-criteria", "phase": 0, "label": "Define comparison axes", "desc": "Choosing the axes along which approaches are compared — each one an operationalized property with a stated measure, direction and caveats.", "outline": ["List candidate axes from the decision the question serves", "Operationalize each axis: measure, unit, better-direction", "Separate mechanism axes (what it is) from performance axes (how it does)", "Mark axes where the papers use incompatible measures", "Prune axes that do not affect the decision"], "ideas": ["Axes are where precision lives; vague axes produce vague cells", "Mechanism axes (forward process, loss, parameterization) are checkable from method sections", "Performance axes need protocol conditions attached", "Fewer, sharper axes beat a long wishlist"], "questions": [{"q": "Give three mechanism axes and two performance axes for comparing discrete diffusion approaches.", "a": "Mechanism: noise process (uniform vs. absorbing), objective (ELBO vs. score entropy vs. masked-CE mixture), time handling (discrete vs. continuous). Performance: perplexity bound and generative quality at a fixed step count."}, {"q": "Why does every axis need a stated measure and better-direction?", "a": "Otherwise reviewers and agents cannot score a cell, and two cells on the same axis may use different measures."}, {"q": "When should an axis be dropped?", "a": "When no value on it would change the decision the comparison serves."}], "sources": [{"t": "Stanford Encyclopedia of Philosophy — Operationalism", "u": "https://plato.stanford.edu/entries/operationalism/"}, {"t": "Austin et al., Structured Denoising Diffusion Models in Discrete State-Spaces — D3PM (NeurIPS 2021)", "u": "https://arxiv.org/abs/2107.03006"}]},
{"id": "evidence-standards", "phase": 0, "label": "Set evidence standards", "desc": "Deciding in advance what counts as support for a claim in this comparison — which source types, which result types, and how much is enough.", "outline": ["Rank admissible source types for this question", "Decide which claim types need a primary table or equation", "Write the rule for conflicting numbers", "Decide what verbatim quote is required per claim", "State what is out of bounds (blogs, leaderboards, unrefereed claims)"], "ideas": ["Standards written before searching prevent motivated acceptance", "A claim needs grounds of the right type, not just any citation", "Conflicts need a rule, not a vibe", "Standards are what fact-checkers and reviewers will enforce"], "questions": [{"q": "What is the difference between an evidence hierarchy and an evidence standard?", "a": "A hierarchy ranks evidence in general; a standard is your pre-committed rule for what is sufficient for each claim type in this question."}, {"q": "What should the standard say for a performance claim like “MDLM reaches lower perplexity than SEDD”?", "a": "Require the primary table, matched dataset, tokenizer and model size, and note that both are bounds."}, {"q": "Why commit to standards before the agents search?", "a": "After seeing results you are tempted to relax standards for convenient claims; pre-commitment keeps verification honest."}], "sources": [{"t": "Guyatt et al., GRADE: an emerging consensus on rating quality of evidence and strength of recommendations (BMJ, 2008)", "u": "https://doi.org/10.1136/bmj.39489.470347.AD"}, {"t": "Toulmin, The Uses of Argument (updated ed., Cambridge UP, 2003)", "u": "https://doi.org/10.1017/CBO9780511840005"}]},
{"id": "systematic-review-protocol", "phase": 0, "label": "Systematic review protocols", "desc": "The medical-evidence discipline for making a literature review a repeatable process: a protocol written in advance, explicit search and inclusion rules, duplicate extraction, and a transparent flow of what was excluded.", "outline": ["Why reviews pre-register a protocol", "Search strategy: sources, terms, sensitivity vs. precision", "Eligibility criteria and screening", "Duplicate independent data extraction", "Reporting: PRISMA checklist and flow diagram"], "ideas": ["This turns ad-hoc literature reading into a repeatable process", "Every step is designed to be done by two people independently — a template for agents", "The flow diagram makes exclusions auditable", "A protocol lets someone else rerun your review"], "questions": [{"q": "What does a PRISMA flow diagram record, and why?", "a": "How many records were identified, screened, excluded (with reasons) and included, so readers can audit selection bias."}, {"q": "Why do Cochrane reviews extract data with two independent reviewers?", "a": "Independent extraction catches errors and subjective judgements that a single extractor would propagate unseen."}, {"q": "Which protocol elements map directly onto a multi-agent setup?", "a": "Search strategy to researcher briefs, eligibility criteria to screening rules, duplicate extraction to independent checkers, flow diagram to an evidence ledger."}], "sources": [{"t": "Page et al., The PRISMA 2020 statement: an updated guideline for reporting systematic reviews (BMJ, 2021)", "u": "https://doi.org/10.1136/bmj.n71"}, {"t": "Cochrane Handbook, ch. 4 — Searching for and selecting studies", "u": "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-04"}]},
{"id": "diffusion-design-space", "phase": 7, "label": "Discrete diffusion design space", "desc": "The real differences between D3PM, SEDD and MDLM: noise process, what the network predicts, training objective, and sampler — the raw material for comparison axes.", "outline": ["D3PM: structured transition matrices (uniform, absorbing, nearest-neighbour) and a hybrid ELBO + auxiliary loss", "SEDD: learn the concrete score (ratios p(y)/p(x)) with the score-entropy loss", "MDLM / MD4: absorbing-only, simplified continuous-time ELBO as a weighted mixture of masked-LM losses", "RADD: the absorbing concrete score factorizes into a time-free clean-data conditional", "Samplers: ancestral, tau-leaping, first-hitting"], "ideas": ["Absorbing (mask) noise has dominated recent text results", "SEDD and MDLM differ in objective framing more than in what is learned under absorbing noise", "Time-agnostic results mean the network need not see t in masked models", "Each paper’s headline gain mixes method and training recipe"], "questions": [{"q": "What does SEDD’s network estimate, and what loss trains it?", "a": "The concrete score — ratios of probabilities between neighbouring sequences — trained with score entropy, a discrete analogue of score matching."}, {"q": "What simplification do MDLM and MD4 share?", "a": "For absorbing noise, the continuous-time ELBO reduces to a weighted integral (mixture) of masked-language-model cross-entropy losses."}, {"q": "What does RADD show about the absorbing concrete score?", "a": "It factorizes into a time-independent conditional distribution of clean data times an analytic time-dependent scalar, so the network can be time-free."}], "sources": [{"t": "Lou, Meng & Ermon, Discrete Diffusion Modeling by Estimating the Ratios of the Data Distribution — SEDD (ICML 2024)", "u": "https://arxiv.org/abs/2310.16834"}, {"t": "Sahoo et al., Simple and Effective Masked Diffusion Language Models — MDLM (NeurIPS 2024)", "u": "https://arxiv.org/abs/2406.07524"}, {"t": "Shi et al., Simplified and Generalized Masked Diffusion for Discrete Data — MD4 (NeurIPS 2024)", "u": "https://arxiv.org/abs/2406.04329"}, {"t": "Ou et al., Your Absorbing Discrete Diffusion Secretly Models the Conditional Distributions of Clean Data — RADD (2024)", "u": "https://arxiv.org/abs/2406.03736"}, {"t": "Zheng et al., Masked Diffusion Models are Secretly Time-Agnostic Masked Models and Exploit Inaccurate Categorical Sampling (2024)", "u": "https://arxiv.org/abs/2409.02908"}]},
{"id": "context-engineering", "phase": 4, "label": "Context engineering", "desc": "Treating the context window as a scarce attention budget: deciding what each agent sees, in what form, and what is kept out.", "outline": ["Context as a finite attention budget", "Smallest high-signal context for a task", "Compaction and structured note-taking for long tasks", "Subagents returning condensed summaries", "What to deliberately exclude from a context"], "ideas": ["More context is not more knowledge; it dilutes attention", "Isolation is a feature: a clean context sees only what matters", "Summaries passed between agents are lossy by design — choose what survives", "This is the mechanism that later makes blind verification possible"], "questions": [{"q": "What does Anthropic mean by an “attention budget”?", "a": "Every token added to context draws on finite model attention, so recall and reasoning degrade as context grows — context rot."}, {"q": "Why might a subagent explore tens of thousands of tokens but return only 1–2k?", "a": "To keep detailed search context isolated in the subagent while passing the lead agent a condensed result."}, {"q": "Name something a fact-checker’s context should deliberately exclude.", "a": "The researcher’s reasoning and the draft conclusion, so the check is not anchored on them."}], "sources": [{"t": "Anthropic, Effective context engineering for AI agents (2025)", "u": "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"}, {"t": "Chroma Research, Context Rot: How Increasing Input Tokens Impacts LLM Performance (2025)", "u": "https://www.trychroma.com/research/context-rot"}]},
{"id": "question-decomposition", "phase": 1, "label": "Decompose the question", "desc": "Breaking a compare-and-contrast question into answerable sub-questions — one per approach × axis — each small enough to answer from a few sources.", "outline": ["Expand the question into approaches × axes", "Turn each cell into a closed sub-question", "Order sub-questions: mechanism first, performance second", "Identify cross-cutting questions (shared baselines, protocol differences)", "Check the parts recompose into the original question"], "ideas": ["Models answer sub-questions they cannot compose — the compositionality gap", "Explicit decomposition makes the gap visible and fixable", "Each sub-question becomes one subagent’s task", "Decomposition is a thinking step, done before any agent runs"], "questions": [{"q": "What is the compositionality gap?", "a": "The finding that models often answer every sub-question correctly yet fail the composed question, and that the gap does not shrink with scale."}, {"q": "Decompose “Is MDLM’s gain over SEDD from the method or the recipe?”", "a": "Sub-questions on each paper’s training tokens, tokenizer, architecture and steps; whether ablations isolate the objective; and whether results were rerun under a shared recipe."}, {"q": "How do you know a decomposition is complete?", "a": "Answers to the sub-questions, combined by a stated rule, fully answer the original question with no extra assumptions."}], "sources": [{"t": "Press et al., Measuring and Narrowing the Compositionality Gap in Language Models — Self-Ask (Findings of EMNLP 2023)", "u": "https://arxiv.org/abs/2210.03350"}, {"t": "Zhou et al., Least-to-Most Prompting Enables Complex Reasoning in LLMs (ICLR 2023)", "u": "https://arxiv.org/abs/2205.10625"}, {"t": "Shao et al., Assisting in Writing Wikipedia-like Articles From Scratch with LLMs — STORM (NAACL 2024)", "u": "https://arxiv.org/abs/2402.14207"}]},
{"id": "comparison-matrix", "phase": 1, "label": "Comparison matrix design", "desc": "Laying the comparison out as a table — approaches as rows, operationalized axes as columns — where every cell is a claim to be sourced.", "outline": ["Rows: approaches with version and paper", "Columns: operationalized axes from the criteria", "Cell spec: value, condition, source slot, quote slot", "Schema first, then values", "Mark cells expected to be empty or contested"], "ideas": ["Literature-review tables are a known task: schema generation, then value generation", "Grounding the schema in captions and text improves generated tables", "Empty cells are information — they show what is not known", "The matrix is the shared object every agent writes to"], "questions": [{"q": "How does ArxivDIGESTables decompose literature-table generation?", "a": "Into schema generation (choosing aspects/columns) and value generation (filling cells), with additional grounding context improving results."}, {"q": "Why should cells hold conditions as well as values?", "a": "A number without its dataset, scale and metric variant cannot be compared with other cells in the same column."}, {"q": "What does an empty cell mean, and why keep it?", "a": "No admissible evidence was found; keeping it stops the synthesis from implying knowledge that does not exist."}], "sources": [{"t": "Newman et al., ArxivDIGESTables: Synthesizing Scientific Literature into Tables using Language Models (EMNLP 2024)", "u": "https://arxiv.org/abs/2410.22360"}, {"t": "Cochrane Handbook, ch. 5 — Collecting data", "u": "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-05"}]},
{"id": "like-for-like", "phase": 1, "label": "Like-for-like comparison", "desc": "Making sure differences in a comparison come from the methods and not from tuning budget, data, tokenizer, metric variant or evaluation bug.", "outline": ["List the confounds: compute, tuning, data, tokenizer, metric variant", "Find the shared-protocol results, if any exist", "Treat bounds and exact likelihoods differently", "Check for evaluation artefacts (sampling precision, temperature)", "Mark comparisons that are not like-for-like instead of dropping them"], "ideas": ["Well-tuned baselines often erase claimed gains", "Recipe changes alone can move a headline number several-fold", "In discrete diffusion, recipe and sampler artefacts have moved headline numbers", "Marking non-comparable cells is more honest than forcing them into one ranking"], "questions": [{"q": "What did Melis et al. show about LSTM baselines?", "a": "With careful hyperparameter tuning, standard LSTMs beat several more recent architectures, so earlier gains reflected tuning, not design."}, {"q": "What did Zheng et al. find about generative perplexity for masked diffusion models?", "a": "A float32 numerical issue in categorical sampling lowered effective temperature and token diversity, making earlier generative-perplexity comparisons unfair."}, {"q": "In MDLM’s LM1B table, D3PM-absorb reports ≤76.90 perplexity and MDLM ≤27.04. Why is that not a method comparison?", "a": "Different sizes, training tokens and recipe: MDLM’s own ablation shows a D3PM-equivalent objective reaching about 28.5 under its recipe, so most of the gap is training, not method."}], "sources": [{"t": "Melis, Dyer & Blunsom, On the State of the Art of Evaluation in Neural Language Models (ICLR 2018)", "u": "https://arxiv.org/abs/1707.05589"}, {"t": "Sahoo et al., Simple and Effective Masked Diffusion Language Models — MDLM (NeurIPS 2024)", "u": "https://arxiv.org/abs/2406.07524"}, {"t": "Zheng et al., Masked Diffusion Models are Secretly Time-Agnostic Masked Models and Exploit Inaccurate Categorical Sampling (2024)", "u": "https://arxiv.org/abs/2409.02908"}]},
{"id": "search-and-inclusion", "phase": 1, "label": "Search & inclusion rules", "desc": "Turning the precise question into an explicit search strategy and eligibility rules, so coverage of the landscape is deliberate and auditable.", "outline": ["Derive search terms from the question’s elements", "Choose sources: arXiv, proceedings, citation chasing", "Write inclusion and exclusion criteria", "Plan a coverage check against known key papers", "Log exclusions with reasons"], "ideas": ["Coverage failures are invisible unless you test for them", "Citation chasing finds what keyword search misses", "Exclusions with reasons let others audit the landscape", "A coverage list of must-include papers is a cheap test"], "questions": [{"q": "What is the trade-off between search sensitivity and precision?", "a": "High sensitivity finds most relevant work but returns many irrelevant hits to screen; high precision returns few but misses relevant studies."}, {"q": "Write one inclusion and one exclusion rule for the diffusion comparison.", "a": "Include: peer-reviewed or widely cited preprints proposing a discrete diffusion LM objective with text results. Exclude: image-only discrete diffusion and continuous-embedding text diffusion."}, {"q": "How would you test whether the search missed something?", "a": "Seed a must-include list (D3PM, SEDD, MDLM, MD4) and check the search recovers all of them."}], "sources": [{"t": "Cochrane Handbook, ch. 4 — Searching for and selecting studies", "u": "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-04"}, {"t": "Page et al., The PRISMA 2020 statement: an updated guideline for reporting systematic reviews (BMJ, 2021)", "u": "https://doi.org/10.1136/bmj.n71"}]},
{"id": "agent-briefs", "phase": 4, "label": "Write agent briefs", "desc": "The specification a subagent receives: objective, output format, tools and sources to use, and boundaries — the precise question, translated for a worker.", "outline": ["Objective: one sub-question, stated precisely", "Output format: the exact fields to return", "Tools and source guidance (and what to avoid)", "Boundaries: what is out of scope, when to stop", "Effort scaling: how many sources or calls"], "ideas": ["Anthropic found vague briefs cause duplicated work, gaps and wrong sources", "A brief is a precise question plus an output contract", "Agents preferred SEO content over papers until briefs said otherwise", "Briefs live in files so they can be reviewed and reused"], "questions": [{"q": "What four things does Anthropic say each subagent brief needs?", "a": "An objective, an output format, guidance on tools and sources, and clear task boundaries."}, {"q": "What failure did Anthropic see when briefs were short?", "a": "Agents duplicated work, left gaps or misread the task — for example several agents researching the same thing."}, {"q": "Why include source guidance like “prefer arXiv/proceedings over blogs”?", "a": "Early agents favoured SEO-optimized content farms over authoritative sources until source-quality heuristics were added."}], "sources": [{"t": "Anthropic, How we built our multi-agent research system (2025)", "u": "https://www.anthropic.com/engineering/multi-agent-research-system"}, {"t": "Anthropic, Effective context engineering for AI agents (2025)", "u": "https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents"}]},
{"id": "claim-records", "phase": 2, "label": "Claim records", "desc": "The atomic unit every agent produces: one claim, the matrix cell it fills, the source, a verbatim supporting quote, conditions, and a confidence label.", "outline": ["Atomic claims: one checkable assertion each", "Fields: claim, cell, source, locator, verbatim quote, conditions, confidence", "Quote-first: no quote, no claim", "Separate ‘reported by authors’ from ‘measured under shared protocol’", "Store records as JSON lines, not prose"], "ideas": ["Atomic facts make factuality measurable (FActScore, SAFE)", "A verbatim quote turns ‘trust me’ into a check anyone can run", "Conditions travel with the claim, preserving qualifiers", "Prose synthesis comes last, from records — never the other way round"], "questions": [{"q": "Why break long-form output into atomic claims?", "a": "Each atomic claim can be checked against a source independently, so precision becomes measurable instead of a holistic impression."}, {"q": "What is the minimum field set for a claim record here?", "a": "Claim text, target cell, source, locator (page/table), verbatim quote, conditions and confidence."}, {"q": "A researcher returns a fluent paragraph with three citations at the end. What is wrong, and how do you fix it?", "a": "Claims cannot be matched to support; require one record per claim, each with its own quote and locator."}], "sources": [{"t": "Min et al., FActScore: Fine-grained Atomic Evaluation of Factual Precision (EMNLP 2023)", "u": "https://arxiv.org/abs/2305.14251"}, {"t": "Wei et al., Long-form factuality in large language models — SAFE (2024)", "u": "https://arxiv.org/abs/2403.18802"}]},
{"id": "handoff-contracts", "phase": 2, "label": "Structured handoffs", "desc": "Schemas for what passes between agents — brief in, records out — so outputs are machine-checkable and nothing important is lost in a free-text summary.", "outline": ["Define input and output schemas for each role", "Use structured outputs / JSON Schema to enforce them", "Pass records, not paraphrase", "Include provenance fields (who produced, from what)", "Validate at every boundary; reject malformed outputs"], "ideas": ["Free-text handoffs are where context and qualifiers get lost", "Schema enforcement turns format errors into hard failures you can see", "Cognition’s warning: subagents that lack shared context make conflicting implicit decisions", "Provenance fields make later disagreement traceable"], "questions": [{"q": "What does strict structured output guarantee, and what does it not?", "a": "It guarantees the response matches the JSON Schema; it does not guarantee the content is true or well-sourced."}, {"q": "What is Cognition’s core objection to naive multi-agent setups?", "a": "Subagents work from partial context and make conflicting implicit decisions; their outputs then do not fit together."}, {"q": "How do structured handoffs answer that objection for research tasks?", "a": "Every worker gets the same question, axes and evidence standard, and returns records in one schema, so outputs compose."}], "sources": [{"t": "OpenAI API docs — Structured model outputs", "u": "https://developers.openai.com/api/docs/guides/structured-outputs"}, {"t": "Cognition, Don’t Build Multi-Agents (2025)", "u": "https://cognition.com/blog/dont-build-multi-agents"}]},
{"id": "evidence-grading", "phase": 2, "label": "Grade confidence", "desc": "Attaching an explicit, calibrated confidence to each claim based on evidence type, comparability and corroboration — not on how sure the prose sounds.", "outline": ["Start from evidence type (primary table vs. quoted claim)", "Downgrade for non-comparable conditions", "Upgrade for independent replication", "Use few labelled levels with written definitions", "Check whether model-stated confidence is calibrated"], "ideas": ["GRADE’s up/downgrade logic transfers directly to ML claims", "Verbalized confidence can be better calibrated than raw token probabilities in RLHF models", "Unanchored confidence numbers are noise; defined levels are checkable", "Confidence is per claim, never per report"], "questions": [{"q": "How would GRADE-style reasoning downgrade “SEDD beats GPT-2”?", "a": "For indirectness: generative perplexity of un-annealed GPT-2 at small scale is not a general comparison, and the likelihood result is a bound."}, {"q": "What did Tian et al. find about eliciting confidence from RLHF models?", "a": "Verbalized confidence is often better calibrated than the model’s conditional probabilities, cutting calibration error substantially."}, {"q": "Why define confidence levels in words instead of asking for a 0–100 number?", "a": "Defined levels tie confidence to evidence features a checker can verify; free numbers drift and are not comparable across agents."}], "sources": [{"t": "Cochrane Handbook, ch. 14 — Summary of findings tables and grading the certainty of the evidence", "u": "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-14"}, {"t": "Tian et al., Just Ask for Calibration: eliciting calibrated confidence from RLHF models (EMNLP 2023)", "u": "https://arxiv.org/abs/2305.14975"}, {"t": "Kadavath et al., Language Models (Mostly) Know What They Know (2022)", "u": "https://arxiv.org/abs/2207.05221"}]},
{"id": "rubric-writing", "phase": 3, "label": "Write verification rubrics", "desc": "Turning the question, axes, evidence standards and inclusion rules into explicit pass/fail criteria that a reviewer agent can apply cell by cell.", "outline": ["One criterion per checkable property", "Write criteria as observable, binary or few-level", "Cover completeness, faithfulness, comparability, coverage", "Attach weights and a must-pass subset", "Pilot on two cells by hand and revise"], "ideas": ["Rubrics are clear thinking made executable", "Instance-specific rubrics outperform generic quality scores", "A criterion you cannot check by reading is not a criterion", "The rubric is written before the agents run"], "questions": [{"q": "How does HealthBench use rubrics, and why is that relevant here?", "a": "Each conversation has physician-written criteria — 48,562 in total — scored individually, showing that specific criteria make open-ended answers gradable."}, {"q": "Turn the like-for-like requirement into a rubric criterion.", "a": "For example: every performance comparison in a row states dataset, model size, tokenizer and whether the metric is a bound — pass/fail."}, {"q": "What does Prometheus show about rubric-conditioned evaluation?", "a": "An evaluator given a specific score rubric and reference answer can track human judgements closely, making the rubric the key input."}], "sources": [{"t": "Arora et al., HealthBench: Evaluating LLMs Towards Improved Human Health (OpenAI, 2025)", "u": "https://arxiv.org/abs/2505.08775"}, {"t": "Kim et al., Prometheus: Inducing Fine-grained Evaluation Capability in Language Models (ICLR 2024)", "u": "https://arxiv.org/abs/2310.08491"}]},
{"id": "diffusion-matrix", "phase": 7, "label": "D3PM · SEDD · MDLM matrix", "desc": "The worked example’s comparison table: approaches as rows, mechanism and performance axes as columns, with comparability flags for each cell.", "outline": ["Rows: D3PM-absorbing, D3PM-uniform, SEDD-absorb, SEDD-uniform, MDLM (MD4 as a check)", "Mechanism columns: noise, objective, parameterization, time handling", "Performance columns: perplexity bound, generative quality, steps", "Flag cells whose recipe differs (MDLM retrained baselines)", "Flag generative-perplexity cells affected by the sampling-precision issue", "Expect empty performance cells for uniform-noise rows at matched conditions — keep them empty"], "ideas": ["Mechanism cells are answerable from method sections with high confidence", "Performance cells mostly carry ‘different recipe’ or ‘bound’ flags", "The matrix shows where the field actually agrees", "Your own reading of these papers makes this a test you can grade"], "questions": [{"q": "Which cells can be filled with high confidence from method sections alone?", "a": "Mechanism cells — noise process, objective form, parameterization — because they are stated in equations, not measured."}, {"q": "Which performance cell is most at risk, and why?", "a": "Generative perplexity, because Zheng et al. showed reduced-precision categorical sampling lowered effective temperature and flattered results."}, {"q": "How should a cell comparing SEDD and MDLM perplexity be flagged?", "a": "As upper bounds under possibly different training recipes, with tokens and model size stated for each."}], "sources": [{"t": "Sahoo et al., Simple and Effective Masked Diffusion Language Models — MDLM (NeurIPS 2024)", "u": "https://arxiv.org/abs/2406.07524"}, {"t": "Lou, Meng & Ermon, Discrete Diffusion Modeling by Estimating the Ratios of the Data Distribution — SEDD (ICML 2024)", "u": "https://arxiv.org/abs/2310.16834"}, {"t": "Zheng et al., Masked Diffusion Models are Secretly Time-Agnostic Masked Models and Exploit Inaccurate Categorical Sampling (2024)", "u": "https://arxiv.org/abs/2409.02908"}]},
{"id": "blind-fact-checkers", "phase": 3, "label": "Blind fact-checkers", "desc": "Verifier agents that see only a claim and its source — not the researcher’s reasoning or the draft — and return supported / not supported / partly supported with the decisive quote.", "outline": ["Input: one claim record plus the source text", "Hide the draft, the researcher’s reasoning and the other claims", "Output: verdict, decisive quote, mismatch note", "Factored verification: answer each check independently", "Route failures back to the evidence ledger"], "ideas": ["Chain-of-Verification works best when checks are answered without seeing the draft", "Hiding context prevents anchoring on the researcher’s framing", "Search-augmented checking (SAFE) can beat crowd annotators at a fraction of the cost", "Blindness is configured through context isolation, not instructions"], "questions": [{"q": "Why did factored Chain-of-Verification beat joint verification?", "a": "Answering verification questions without the draft response in context stops the model repeating the draft’s hallucinations."}, {"q": "What exactly should a blind fact-checker receive?", "a": "The claim text, its conditions and the source passage or document — nothing about why the researcher believes it."}, {"q": "What did SAFE show about automated fact-checking?", "a": "Search-augmented per-fact checking agreed with crowd annotators 72% of the time and won 76% of disagreements, at over 20× lower cost."}], "sources": [{"t": "Dhuliawala et al., Chain-of-Verification Reduces Hallucination in Large Language Models (2023)", "u": "https://arxiv.org/abs/2309.11495"}, {"t": "Wei et al., Long-form factuality in large language models — SAFE (2024)", "u": "https://arxiv.org/abs/2403.18802"}]},
{"id": "citation-support", "phase": 3, "label": "Does the citation support it?", "desc": "Checking attribution, not existence: whether the cited passage actually entails the claim, under the claim’s stated conditions.", "outline": ["Attributable to Identified Sources: ‘According to P, s’ must hold", "Citation recall vs. citation precision", "Entailment, partial support and topical-only citations", "Condition mismatch: right paper, wrong setting", "Score support rate per agent and per source"], "ideas": ["A real, relevant citation can still fail to support the sentence", "Generative search engines fully supported only about half their sentences", "Topical citations look convincing and are the commonest failure", "Support is judged against the quote and conditions, not the abstract"], "questions": [{"q": "What is the AIS test?", "a": "A statement is attributable if a generic reader would agree “According to P, s” given the identified source P."}, {"q": "What did Liu, Zhang & Liang find for generative search engines?", "a": "Only 51.5% of generated sentences were fully supported by their citations, and only 74.5% of citations supported their sentence."}, {"q": "A claim cites MDLM for “masked diffusion matches AR perplexity.” What is the likely support verdict?", "a": "Partial at best: MDLM reports approaching AR perplexity, as a bound, so the claim overstates the source."}], "sources": [{"t": "Rashkin et al., Measuring Attribution in Natural Language Generation Models — AIS (Computational Linguistics, 2023)", "u": "https://arxiv.org/abs/2112.12870"}, {"t": "Liu, Zhang & Liang, Evaluating Verifiability in Generative Search Engines (Findings of EMNLP 2023)", "u": "https://arxiv.org/abs/2304.09848"}, {"t": "Gao et al., Enabling Large Language Models to Generate Text with Citations — ALCE (EMNLP 2023)", "u": "https://arxiv.org/abs/2305.14627"}]},
{"id": "rubric-reviewers", "phase": 3, "label": "Rubric-scored reviewers", "desc": "LLM judges that score the matrix or synthesis against your rubric criterion by criterion, with reasons, instead of giving a holistic grade.", "outline": ["Give the reviewer the rubric, the artefact and the evidence standard", "Score each criterion separately, with a reason", "Require pass/fail on must-pass criteria", "Calibrate against your own grading on a few cells", "Known judge biases and simple mitigations"], "ideas": ["Strong LLM judges reach human-level agreement on many tasks", "Position, verbosity and self-enhancement biases are documented", "Per-criterion scoring is easier to audit than one score", "Anthropic’s research system found a single rubric-guided judge call most consistent"], "questions": [{"q": "What biases did Zheng et al. document in LLM-as-a-judge?", "a": "Position bias, verbosity bias and self-enhancement bias, plus limited ability to grade math and reasoning."}, {"q": "What rubric dimensions did Anthropic use to judge research outputs?", "a": "Factual accuracy, citation accuracy, completeness, source quality and tool efficiency, scored 0.0–1.0 with pass/fail."}, {"q": "How do you know the reviewer is grading the way you would?", "a": "Grade a sample yourself and measure agreement with the reviewer before trusting it at scale."}], "sources": [{"t": "Zheng et al., Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena (NeurIPS 2023)", "u": "https://arxiv.org/abs/2306.05685"}, {"t": "Anthropic, How we built our multi-agent research system (2025)", "u": "https://www.anthropic.com/engineering/multi-agent-research-system"}, {"t": "Liu et al., G-Eval: NLG Evaluation using GPT-4 with Better Human Alignment (EMNLP 2023)", "u": "https://arxiv.org/abs/2303.16634"}]},
{"id": "agreement-metrics", "phase": 3, "label": "Measure agreement", "desc": "Quantifying how often two graders — you, a reviewer agent, another model — agree beyond chance, so that ‘the reviewer agrees with me’ becomes a number.", "outline": ["Percent agreement and why it misleads", "Cohen’s kappa: correcting for chance", "Interpreting kappa thresholds", "Agreement per rubric criterion", "Disagreement analysis: where and why graders split"], "ideas": ["High raw agreement can be mostly chance on skewed labels", "McHugh argues kappa below 0.60 is inadequate for many uses", "Measure agreement per criterion; averages hide weak ones", "Agreement says nothing about independence — two graders can share the same error"], "questions": [{"q": "Why is percent agreement not enough?", "a": "Two graders who both mark 90% of claims ‘supported’ agree often by chance; kappa subtracts expected chance agreement."}, {"q": "What kappa would make you distrust a reviewer agent on a criterion?", "a": "Below about 0.60, which McHugh treats as weak or inadequate agreement."}, {"q": "Why does high agreement between two models not prove they are right?", "a": "They can share errors; agreement measures consistency, not accuracy or independence."}], "sources": [{"t": "McHugh, Interrater reliability: the kappa statistic (Biochemia Medica, 2012)", "u": "https://doi.org/10.11613/BM.2012.031"}, {"t": "Cemri et al., Why Do Multi-Agent LLM Systems Fail? — MAST taxonomy (2025)", "u": "https://arxiv.org/abs/2503.13657"}]},
{"id": "subagents-and-isolation", "phase": 4, "label": "Subagents & context isolation", "desc": "How Claude Code and Codex spawn subagents: each with its own context window, system prompt, tools, permissions and model — the mechanism that makes blind checking and parallel research possible.", "outline": ["Define a subagent: Markdown file with YAML frontmatter (name, description, tools, model)", "Each runs in its own context window with its own permissions", "Explicit vs. automatic delegation", "Restrict tools per role (read-only checkers)", "Codex custom agents and subagent workflows"], "ideas": ["Isolation is configured, not requested: what is not passed, is not seen", "Per-role tool lists double as a security boundary", "Model choice is per subagent — the hook for cross-model review", "Subagents return summaries; design what comes back"], "questions": [{"q": "What does a Claude Code subagent definition contain?", "a": "A Markdown file with YAML frontmatter — name, description, tools, model — and a body that is its system prompt."}, {"q": "How does subagent isolation implement a blind fact-checker?", "a": "The checker runs in a fresh context that only receives what you pass — claim and source — so it cannot see the researcher’s reasoning."}, {"q": "Why give a fact-checker a narrower tool list than a researcher?", "a": "It needs only to read the source; removing search and write tools limits drift and blast radius."}], "sources": [{"t": "Claude Code docs — Create custom subagents", "u": "https://code.claude.com/docs/en/sub-agents"}, {"t": "OpenAI Codex docs — Subagents", "u": "https://learn.chatgpt.com/docs/agent-configuration/subagents"}]},
{"id": "diffusion-answer-key", "phase": 7, "label": "Diffusion answer key", "desc": "Your own hand-verified claim records for the diffusion matrix — the cells you can grade yourself from papers you have worked through in detail.", "outline": ["Pick 15–25 cells you can verify yourself", "Write claim records with quote, locator, conditions, confidence", "Include traps: bounds vs. exact, recipe changes, sampling-precision effects", "Mark cells where the literature is genuinely contested", "Freeze the key before running the system"], "ideas": ["Close, first-hand reading of the papers is the asset that makes evaluation possible", "Traps test whether the system preserves qualifiers", "Contested cells test whether it reports disagreement instead of resolving it falsely", "Freezing prevents grading drift"], "questions": [{"q": "Why must the answer key be frozen before the system runs?", "a": "Otherwise you unconsciously adjust it to the system’s outputs, and the evaluation stops measuring anything."}, {"q": "Give one trap cell and the correct answer.", "a": "“Is MDLM’s reported perplexity exact?” — no, it is an upper bound from the ELBO."}, {"q": "What should the key say for a contested cell?", "a": "That sources disagree or conditions differ, with both quotes — the correct system output is the disagreement, not a winner."}], "sources": [{"t": "Sahoo et al., Simple and Effective Masked Diffusion Language Models — MDLM (NeurIPS 2024)", "u": "https://arxiv.org/abs/2406.07524"}, {"t": "Lou, Meng & Ermon, Discrete Diffusion Modeling by Estimating the Ratios of the Data Distribution — SEDD (ICML 2024)", "u": "https://arxiv.org/abs/2310.16834"}, {"t": "Austin et al., Structured Denoising Diffusion Models in Discrete State-Spaces — D3PM (NeurIPS 2021)", "u": "https://arxiv.org/abs/2107.03006"}]},
{"id": "orchestrator-loop", "phase": 4, "label": "Orchestrator–worker loop", "desc": "The control flow: a lead agent decomposes, dispatches researchers, routes their records to checkers and reviewers, and iterates until the rubric passes or a budget stops it.", "outline": ["Lead agent plans from the precise question and matrix", "Dispatch researcher subagents per cell or row", "Pipe records to blind checkers, then rubric reviewers", "Loop: re-research failed cells only", "Stop rules: rubric pass, budget, or no new evidence"], "ideas": ["This is the orchestrator-workers pattern plus an evaluator-optimizer loop", "Lead agent holds the plan; workers hold the detail", "Iterate on failing cells, not the whole report", "Stop rules prevent endless searching for sources that do not exist"], "questions": [{"q": "Which two patterns from Building effective agents does this loop combine?", "a": "Orchestrator-workers (dynamic decomposition and delegation) and evaluator-optimizer (generate, critique against criteria, revise)."}, {"q": "Name two early failures Anthropic reported in its research orchestrator.", "a": "Spawning 50 subagents for simple queries and searching endlessly for nonexistent sources."}, {"q": "Why re-research only failing cells?", "a": "It keeps verified records stable, limits cost, and makes each loop’s change attributable."}], "sources": [{"t": "Anthropic, Building effective agents (2024)", "u": "https://www.anthropic.com/engineering/building-effective-agents"}, {"t": "Anthropic, How we built our multi-agent research system (2025)", "u": "https://www.anthropic.com/engineering/multi-agent-research-system"}]},
{"id": "parallelism-and-cost", "phase": 4, "label": "Parallelism & cost", "desc": "When fan-out pays: parallel subagents buy breadth and speed at a large token multiple, so effort must scale with how hard and valuable the question is.", "outline": ["Token multiples: agents ~4×, multi-agent ~15× a chat", "Token usage explains most variance in research performance", "Scale subagent count to question complexity", "Cheaper models for workers, stronger for lead or judge", "Set per-run budgets and log spend per role"], "ideas": ["Breadth-first questions parallelize; tightly coupled reasoning does not", "More tokens buys performance, but only where the task is worth it", "Budgets are part of the design, not an afterthought", "A landscape comparison is the kind of task that justifies the multiple"], "questions": [{"q": "How many more tokens did Anthropic’s multi-agent system use than chat?", "a": "About 15× (single agents about 4×)."}, {"q": "What explained most of the variance in BrowseComp performance?", "a": "Token usage alone explained about 80%, with tool calls and model choice as the other factors."}, {"q": "Which parts of the diffusion comparison should not be parallelized?", "a": "Final synthesis and disagreement resolution, which need the whole matrix in one context."}], "sources": [{"t": "Anthropic, How we built our multi-agent research system (2025)", "u": "https://www.anthropic.com/engineering/multi-agent-research-system"}, {"t": "OpenAI Codex docs — Subagents", "u": "https://learn.chatgpt.com/docs/agent-configuration/subagents"}]},
{"id": "correlated-errors", "phase": 5, "label": "Correlated errors & diversity", "desc": "Why five checkers from the same model family are not five independent checks — and how using different models breaks shared blind spots.", "outline": ["Measure error correlation, not just accuracy", "Kim et al.: when both err, models give the same wrong answer ~60% of the time on one leaderboard", "More accurate models are more correlated, even across providers", "Panels of diverse models as judges", "Self-preference: judges favour their own outputs"], "ideas": ["Redundancy only helps if errors are independent", "Diversity of family matters more than count", "Never let a model grade its own generation", "Cross-model disagreement is a signal to inspect, not noise to average"], "questions": [{"q": "What did Kim et al. find about LLM error correlation?", "a": "Across 350+ models, errors are substantially correlated — on one leaderboard models agree 60% of the time when both err — and stronger models are more correlated, even across providers."}, {"q": "Why should a fact-checker use a different model from the researcher?", "a": "LLM evaluators recognize and favour their own generations, and same-family models share blind spots, so self-checking inflates pass rates."}, {"q": "What did PoLL find about panels of judges?", "a": "A panel of smaller models from disjoint families beat a single large judge, showed less intra-model bias and cost over 7× less."}], "sources": [{"t": "Kim et al., Correlated Errors in Large Language Models (ICML 2025)", "u": "https://arxiv.org/abs/2506.07962"}, {"t": "Panickssery, Bowman & Feng, LLM Evaluators Recognize and Favor Their Own Generations (NeurIPS 2024)", "u": "https://arxiv.org/abs/2404.13076"}, {"t": "Verga et al., Replacing Judges with Juries: Evaluating LLM Generations with a Panel of Diverse Models (2024)", "u": "https://arxiv.org/abs/2404.18796"}]},
{"id": "evidence-ledger", "phase": 3, "label": "Evidence ledger & disagreements", "desc": "The single record of every claim, check verdict, review score and dispute — plus the rule for resolving disagreement by going back to the quote, not by majority vote.", "outline": ["One row per claim with all verdicts attached", "Disagreement types: source conflict, condition mismatch, checker error", "Resolution rule: re-read the decisive quote; escalate to you if still split", "Keep unresolved disputes visible in the final output", "Ledger as audit trail (PRISMA-style flow of claims)"], "ideas": ["Majority vote among correlated agents can amplify a shared error", "Debate can improve factuality but can also converge on confident errors", "A dispute that ends with the quote is resolved; one that ends with a vote is not", "Unresolved is a valid final state"], "questions": [{"q": "Why not resolve checker–researcher disagreements by majority vote?", "a": "Agents share correlated errors, so a majority can be confidently wrong; the decisive evidence is the source passage."}, {"q": "What does multiagent debate (Du et al.) show, and what is its limit here?", "a": "Debate among model instances improved factuality and reasoning, but instances share blind spots and can converge on the same error."}, {"q": "Give the three main disagreement types and the action for each.", "a": "Source conflict: report both. Condition mismatch: split the cell by condition. Checker error: correct the verdict and log it."}], "sources": [{"t": "Du et al., Improving Factuality and Reasoning in Language Models through Multiagent Debate (ICML 2024)", "u": "https://arxiv.org/abs/2305.14325"}, {"t": "Page et al., The PRISMA 2020 statement: an updated guideline for reporting systematic reviews (BMJ, 2021)", "u": "https://doi.org/10.1136/bmj.n71"}, {"t": "Cochrane Handbook, ch. 5 — Collecting data", "u": "https://www.cochrane.org/authors/handbooks-and-manuals/handbook/current/chapter-05"}]},
{"id": "judge-sycophancy", "phase": 5, "label": "Sycophantic reviewers", "desc": "Reviewers that agree with the framing they are given, defer to confident claims, or reverse a correct verdict when pushed — and how to design prompts and flows that resist it.", "outline": ["What sycophancy is and where it comes from (preference training)", "Symptoms: agreeing with stated user views, caving to “are you sure?”", "Don’t reveal the desired answer or the researcher’s confidence", "Ask for failures first: “list criteria this fails”", "Spot-check passes, not just fails"], "ideas": ["Sycophancy is a learned tendency of preference-trained assistants", "A reviewer that sees your hypothesis is primed to confirm it", "Asking for evidence of failure counteracts default agreement", "Audit the passes — that is where sycophancy hides"], "questions": [{"q": "What did Sharma et al. find about sycophancy?", "a": "Leading assistants consistently tailor answers to users’ stated views and wrongly admit mistakes when challenged, and humans and preference models sometimes prefer sycophantic answers."}, {"q": "Name two prompt-design choices that reduce reviewer sycophancy.", "a": "Withhold the desired conclusion and the producer’s confidence, and require the reviewer to find failing criteria with quotes before any pass."}, {"q": "Why audit passed items more than failed ones?", "a": "Sycophancy produces false passes; failures already get a second look."}], "sources": [{"t": "Sharma et al., Towards Understanding Sycophancy in Language Models (ICLR 2024)", "u": "https://arxiv.org/abs/2310.13548"}, {"t": "Zheng et al., Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena (NeurIPS 2023)", "u": "https://arxiv.org/abs/2306.05685"}]},
{"id": "prompt-injection", "phase": 5, "label": "Prompt injection from pages", "desc": "Fetched web pages and PDFs are untrusted input; text in them can instruct your agents. The defence is architecture — who can read what, and who can act.", "outline": ["Indirect prompt injection: instructions planted in retrieved content", "The lethal trifecta: private data + untrusted content + outbound channel", "Least privilege per subagent", "Quarantine: models that read untrusted text get no tools", "Harness controls: permission modes, network approval, sandboxing"], "ideas": ["Any agent that reads the web can be steered by the web", "Security comes from removing one leg of the trifecta, not from filters", "CaMeL separates control flow (trusted) from data (untrusted)", "Read-only checkers with no outbound tools are cheap insurance"], "questions": [{"q": "What is indirect prompt injection?", "a": "Attacker instructions placed in content an LLM retrieves — web pages, documents — that the model then follows as if they were instructions."}, {"q": "What is the lethal trifecta, and how do you break it?", "a": "Access to private data, exposure to untrusted content and the ability to communicate externally; remove at least one per agent."}, {"q": "What is CaMeL’s core design idea?", "a": "Extract control and data flow from the trusted query so untrusted retrieved data can never change program flow, and enforce capability policies at tool calls."}], "sources": [{"t": "Greshake et al., Not what you’ve signed up for: Indirect Prompt Injection (AISec 2023)", "u": "https://arxiv.org/abs/2302.12173"}, {"t": "Willison, The lethal trifecta for AI agents (2025)", "u": "https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/"}, {"t": "Debenedetti et al., Defeating Prompt Injections by Design — CaMeL (2025)", "u": "https://arxiv.org/abs/2503.18813"}]},
{"id": "known-answer-set", "phase": 6, "label": "Known-answer test set", "desc": "Turning the answer key into a test: the system’s claim records are scored against your key for cell coverage, correctness, support and preserved qualifiers.", "outline": ["Map system records to key cells", "Score: correct, wrong, missing, overclaimed", "Score traps separately (bounds, recipe, sampler)", "Check contested cells are reported as contested", "Track agreement between your grades and the reviewer’s"], "ideas": ["A system is trusted on a landscape you do not know only after it passes one you do", "Trap scores measure precision, the property you care about most", "Your agreement with the reviewer agent decides whether you can stop hand-grading", "Keep the set small and fixed; grow it from failures"], "questions": [{"q": "What are the four outcome categories when scoring a record against the key?", "a": "Correct, wrong, missing (a key cell not covered) and overclaimed (stronger than the source supports)."}, {"q": "Why score trap cells separately?", "a": "They measure whether the system preserves qualifiers and comparability flags — overall accuracy can hide a total failure there."}, {"q": "How does reviewer–you agreement change your workflow?", "a": "If kappa on a criterion is high, you can let the reviewer grade that criterion and only spot-check."}], "sources": [{"t": "Husain, Your AI Product Needs Evals (2024)", "u": "https://hamel.dev/blog/posts/evals/"}, {"t": "McHugh, Interrater reliability: the kappa statistic (Biochemia Medica, 2012)", "u": "https://doi.org/10.11613/BM.2012.031"}]},
{"id": "research-pipeline", "phase": 4, "label": "Run the full pipeline", "desc": "Wiring the pieces end to end in your harness: question and matrix in, researchers fan out, records flow through blind checks, cross-model review and the ledger, synthesis out.", "outline": ["Stage 0: precise question, axes, standards, rubric (you)", "Stage 1: researcher subagents fill cells with records", "Stage 2: blind checkers on a different model", "Stage 3: rubric reviewer on the matrix", "Stage 4: ledger resolution, then synthesis from records only"], "ideas": ["Every stage has a schema in and a schema out", "Synthesis is the last step and may only use verified records", "Different model families at check and review stages", "Each stage’s output is saved, so failures are traceable"], "questions": [{"q": "Why must synthesis draw only on verified records?", "a": "Otherwise the final prose can reintroduce unsupported claims that bypassed every check."}, {"q": "Where in the pipeline do different model families matter most?", "a": "At the blind-check and review stages, so verification does not share the researcher’s blind spots."}, {"q": "MAST groups multi-agent failures into three categories. Which stage addresses each?", "a": "Specification issues: stage 0 briefs and schemas. Inter-agent misalignment: structured handoffs and the ledger. Task verification: checkers and reviewers."}], "sources": [{"t": "Anthropic, How we built our multi-agent research system (2025)", "u": "https://www.anthropic.com/engineering/multi-agent-research-system"}, {"t": "Cemri et al., Why Do Multi-Agent LLM Systems Fail? — MAST taxonomy (2025)", "u": "https://arxiv.org/abs/2503.13657"}]},

const NLEVELS=MAXL+1;
if(changed)console.error("WARNING: cycle detected in edges — prerequisite graph is not a DAG; level layout is truncated. Run the validator.");
// Layout uses the computed longest-path levels as-is. Do not invent skip-level
// edges here — the validator requires every DATA edge to be adjacent (k → k+1).
DATA.edges.forEach(e=>{
  const span=LEVEL[e.to]-LEVEL[e.from];
  if(span!==1)console.error("WARNING: non-adjacent edge",e.from,"->",e.to,"span",span,"— drop, bridge, or demote to see-also; do not redraw it as a long diagonal.");
});

// depth color scale: early → late
const ANCHORS=(typeof THEME!=="undefined"&&THEME.anchors&&THEME.anchors.length>=2)?THEME.anchors:["#1e3a8a","#2563eb","#0d9488","#16a34a","#ca8a04","#eab308"]; // depth ramp — set in MAP-THEME
function hex2rgb(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));}
