<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sourdough Fermentation Microbiology — Prerequisite Map</title>
<style>
  :root{
    --ink:#1e293b; --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; --panel:#ffffff;
    --accent:#2563eb;
    /* engine defaults — the MAP-THEME block in the page's script overrides all of these at startup */
    --ink-2:#334155; --dep-bg:#fbfdff; --edge:#bcc7d4; --edge-related:#7c8aa0;
    --hover-bg:#eff6ff; --match:#f59e0b; --btn-hover-border:#94a3b8;
    --overlay-bg:rgba(255,255,255,.92); --overlay-bg-2:rgba(255,255,255,.85);
    --font-display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --safe-t:env(safe-area-inset-top,0px); --safe-r:env(safe-area-inset-right,0px);
    --safe-b:env(safe-area-inset-bottom,0px); --safe-l:env(safe-area-inset-left,0px);
  }
  *{box-sizing:border-box}
  html,body{height:100%;height:100dvh;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{font-family:var(--font-body);color:var(--ink);background:var(--bg);display:flex;flex-direction:column;max-width:100%}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;padding-left:max(16px,var(--safe-l));padding-right:max(16px,var(--safe-r));padding-top:max(10px,var(--safe-t));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:30}
  .brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;min-width:0}
  header h1{font-size:17px;margin:0;font-weight:650;font-family:var(--font-display)}
  header .stats{font-size:14px;color:var(--muted)}
  .spacer{flex:1}
  .toolbar{display:flex;align-items:center;gap:8px}
  .toolbar-actions{display:flex;align-items:center;gap:8px}
  @media (min-width:901px){
    .brand,.toolbar,.toolbar-actions{display:contents}
  }
  .searchwrap{position:relative}
  #search{width:230px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:15px;outline:none;background:var(--panel);color:var(--ink)}
  #search:focus{border-color:var(--accent)}
  #results{position:absolute;top:36px;left:0;width:300px;max-height:260px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.12);display:none;z-index:50}
  #results div{padding:7px 10px;font-size:15px;cursor:pointer}
  #results div:hover{background:var(--hover-bg)}
  #results .rphase{color:var(--muted);font-size:14px;margin-left:6px}
  button{padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:15px;cursor:pointer;color:var(--ink)}
  button:hover{border-color:var(--btn-hover-border)}
  .iconbtn{display:none;align-items:center;justify-content:center;width:44px;height:44px;padding:0;flex-shrink:0}
  .iconbtn svg{display:block}
  .narrow-only{display:none}
  main{flex:1;display:flex;min-height:0;min-width:0}
  #canvaswrap{flex:1;position:relative;overflow:hidden;min-width:0;min-height:0}
  #graph{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
  #graph.panning{cursor:grabbing}
  #legend{position:absolute;left:12px;bottom:12px;background:var(--overlay-bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;max-width:340px;z-index:20}
  #legend .bar{height:10px;border-radius:5px}
  #legend .barlabels{display:flex;justify-content:space-between;margin-top:3px;color:var(--muted)}
  #legend .cap{margin-top:4px;color:var(--muted);line-height:1.4}
  .sheet-head{display:none;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
  .sheet-head strong{font-size:15px;font-family:var(--font-display)}
  .sheet-handle{display:none;width:36px;height:4px;border-radius:999px;background:var(--line);margin:0 auto 10px}
  .sheet-close{min-height:44px;padding:8px 12px}
  #hint{position:absolute;left:12px;top:12px;font-size:14px;color:var(--muted);background:var(--overlay-bg-2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;z-index:20}
  #tt{position:absolute;display:none;max-width:330px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.18);padding:10px 12px;font-size:14.5px;z-index:40;pointer-events:none;line-height:1.45}
  #tt .who{font-weight:650;font-size:14px;margin-bottom:4px}
  #tt .who .arrow{color:var(--accent)}
  #panel{width:400px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:18px 20px 40px}
  #panel h2{font-size:19px;margin:6px 0 6px;line-height:1.3;font-family:var(--font-display)}
  #panel h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
  #panel p{font-size:15px;line-height:1.55;margin:6px 0}
  #panel ul,#panel ol{margin:4px 0;padding-left:20px}
  #panel li{font-size:15px;line-height:1.5;margin:3px 0}
  #panel ol.outline li{margin:6px 0}
  #panel ol.outline li::marker{color:var(--muted);font-weight:650;font-size:14px}
  #panel details{margin-top:6px}
  #panel summary{cursor:pointer;color:var(--accent);font-size:14px}
  #panel details p{margin:6px 0 2px;font-size:14.5px;color:var(--ink-2)}
  #panel .chip{display:inline-block;font-size:14px;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:999px;color:#fff}
  .dep{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:8px 0;background:var(--dep-bg)}
  .dep b{font-size:15px;cursor:pointer;color:var(--accent)}
  .dep b:hover{text-decoration:underline}
  .dep p{margin:4px 0 2px;font-size:14.5px;color:var(--ink-2)}
  #panel a{color:var(--accent);text-decoration:none;font-size:15px}
  #panel a:hover{text-decoration:underline}
  .backlink{font-size:14.5px;color:var(--accent);cursor:pointer}
  .backlink:hover{text-decoration:underline}
  #scrim{display:none}
  .colbg{opacity:.05}
  .collabel{font-size:14px;font-weight:650;filter:brightness(.62) saturate(1.15)}
  .node rect.main{stroke-width:1.3;cursor:pointer}
  .node text{font-size:14px;fill:var(--ink);pointer-events:none;font-weight:520}
  .node{cursor:pointer}
  .edge path.line{stroke:var(--edge);stroke-width:1.3;fill:none;transition:stroke-width .1s}
  .edge polygon{fill:var(--edge)}
  .edge path.hit{stroke:transparent;stroke-width:16;fill:none;pointer-events:stroke;cursor:pointer}
  svg.dimmed .node:not(.related){opacity:.13}
  svg.dimmed .edge:not(.related){opacity:.05}
  svg.dimmed .colbg{opacity:.02}
  svg.dimmed .collabel:not(.related){opacity:.2}
  .edge.related path.line{stroke:var(--edge-related);stroke-width:1.7}
  .edge.related polygon{fill:var(--edge-related)}
  .edge.direct path.line{stroke:var(--accent);stroke-width:2.1}
  .edge.direct polygon{fill:var(--accent)}
  .edge.hov path.line{stroke:var(--accent);stroke-width:2.6}
  .edge.hov polygon{fill:var(--accent)}
  .node.related rect.main{stroke-width:2.2}
  .node.sel rect.main{stroke-width:2.8}
  .node.match rect.main{stroke:var(--match);stroke-width:2.6}
  .chipbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:14px;font-weight:600;cursor:pointer;background:var(--panel)}
  .chipbtn:hover{border-color:var(--btn-hover-border)}
  .chipbtn .dot{width:8px;height:8px;border-radius:50%}
  @media (pointer:coarse){
    .edge path.hit{stroke-width:28}
  }
  @media (max-width:900px){
    header{z-index:70;flex-wrap:nowrap;gap:8px;padding:8px 12px;padding-left:max(12px,var(--safe-l));padding-right:max(12px,var(--safe-r));padding-top:max(8px,var(--safe-t))}
    .brand{flex:1}
    header h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    header .stats,.spacer{display:none}
    .iconbtn,.narrow-only{display:inline-flex}
    .sheet-head.narrow-only{display:flex}
    .toolbar{position:relative;flex-shrink:0}
    .searchwrap{display:none;flex:1;min-width:0}
    header.search-open .brand{display:none}
    header.search-open .searchwrap{display:block}
    header.search-open #btn-more{display:none}
    #search{width:100%;min-height:44px;font-size:16px;padding:10px 12px}
    #results{left:0;right:0;width:100%;top:calc(100% + 6px);max-height:min(50dvh,360px)}
    #results div{min-height:44px;display:flex;align-items:center;padding:10px 12px}
    .toolbar-actions{display:none;position:absolute;top:calc(100% + 6px);right:0;flex-direction:column;align-items:stretch;min-width:196px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.16);z-index:80}
    header.menu-open .toolbar-actions{display:flex}
    .toolbar-actions button{min-height:44px;width:100%;text-align:left;padding:10px 12px}
    button,.iconbtn,.chipbtn,#panel .backlink,#panel summary{min-height:44px}
    .chipbtn{padding:10px 14px}
    #hint{display:none}
    #legend{display:none;position:fixed;left:0;right:0;bottom:0;top:auto;max-width:none;max-height:min(52dvh,460px);overflow:auto;z-index:60;border-radius:16px 16px 0 0;border:1px solid var(--line);background:var(--panel);padding:12px 16px calc(16px + var(--safe-b));box-shadow:0 -8px 28px rgba(15,23,42,.16)}
    #legend.is-open{display:block}
    #legend .lvlchip{min-width:44px;min-height:44px;justify-content:center}
    #tt{position:fixed;left:0;right:0;bottom:0;top:auto;max-width:none;max-height:min(42dvh,360px);overflow:auto;pointer-events:auto;border-radius:16px 16px 0 0;padding:12px 16px calc(16px + var(--safe-b));z-index:70}
    #panel .backlink{display:inline-flex;align-items:center;min-height:44px;padding-right:8px}
    #tt .sheet-handle,#legend .sheet-handle,#panel .sheet-handle{display:block}
    button,.iconbtn{touch-action:manipulation}
    #panel,#legend,#tt{-webkit-overflow-scrolling:touch}
    #panel{position:fixed;left:0;right:0;bottom:0;width:100%;max-height:min(58dvh,520px);border-left:none;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 16px calc(18px + var(--safe-b));z-index:60;transform:translateY(110%);box-shadow:0 -8px 28px rgba(15,23,42,.16)}
    #panel.is-open{transform:translateY(0)}
    #scrim.is-on{display:block;position:fixed;inset:0;background:rgba(15,23,42,.28);z-index:45}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Sourdough Fermentation Microbiology — from flour and water to a loaf you can predict</h1>
    <span class="stats" id="stats"></span>
  </div>
  <div class="spacer"></div>
  <div class="toolbar">
    <button type="button" id="btn-search-toggle" class="iconbtn narrow-only" aria-label="Search concepts" aria-expanded="false" title="Search">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.25" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.2 15.2 21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="searchwrap">
      <input id="search" type="search" placeholder="Search concepts…" autocomplete="off" enterkeyhint="search">
      <div id="results"></div>
    </div>
    <div class="toolbar-actions" id="toolbar-actions">
      <button type="button" id="btn-theme" title="Toggle themed / default skin">Themed</button>
      <button type="button" id="btn-fit" title="Zoom to fit">Fit</button>
      <button type="button" id="btn-reset" title="Clear selection">Reset</button>
      <button type="button" id="btn-legend" class="narrow-only" aria-expanded="false">Levels</button>
      <button type="button" id="btn-guide" class="narrow-only" aria-expanded="false">Guide</button>
    </div>
    <button type="button" id="btn-more" class="iconbtn narrow-only" aria-label="More controls" aria-expanded="false" aria-controls="toolbar-actions" title="More">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="6" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="18" r="1.7" fill="currentColor"/></svg>
    </button>
  </div>
</header>
<main>
  <div id="canvaswrap">
    <svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="hint">A → B means “learn A before B”. Hover or click any arrow to see <b>why</b> it is a prerequisite.</div>
    <div id="legend"></div>
    <div id="tt"></div>
  </div>
  <aside id="panel"></aside>
</main>
<div id="scrim" hidden></div>

<script>
/*DATA-START*/
const DATA =
{
  "nodes": [
    {
      "id": "flour-starch-amylases",
      "phase": 0,
      "label": "Starch, damage & amylases",
      "desc": "Wheat flour's starch architecture — intact versus milling-damaged granules — and the paired cereal amylases that convert damaged starch into maltose, the sugar that actually feeds a sourdough ferment.",
      "outline": [
        "Starch architecture: amylose/amylopectin packed into A- and B-type granules, and why intact granules exclude enzymes",
        "Milling damage: what counts as damaged starch (roughly 3–10% of flour, higher at higher extraction) and why damaged granules hydrate and become digestible",
        "α-Amylase: endo-cleavage of α-1,4 bonds inside damaged granules, producing soluble dextrins; cereal versus fungal enzyme sources",
        "β-Amylase: exo-trimming of maltose from the new chain ends, stopped at α-1,6 branch points",
        "Maltose in the ferment: uptake and phosphorylysis by starter LAB, with the excreted glucose moiety harvested by yeasts",
        "Control points: diastatic malt or fungal α-amylase, temperature, and how acidification brakes amylolysis"
      ],
      "ideas": [
        "Only mechanically damaged granules are amylolysed — intact granules are enzyme-proof — so damaged-starch content sets the rate of maltose generation; a straight-run white flour carries roughly 3–10%, and higher extraction raises it.",
        "α- and β-amylase work only as a pair: α-amylase multiplies chain ends, β-amylase converts those ends to maltose; β-amylase alone stalls at α-1,6 branch points and cannot attack native granules.",
        "The flour's own free-sugar pool is only about 1% of flour weight and is exhausted within the first hours; from then on, maltose released from damaged starch is the main carbon flow to LAB and yeasts.",
        "Obligately heterofermentative lactobacilli such as L. sanfranciscensis split maltose with maltose phosphorylase and excrete the glucose moiety — yeasts harvest it, so maltose metabolism stabilizes the LAB–yeast association.",
        "Amylase activity falls steeply as dough acidifies below about pH 4, so a long, cool, acidic ferment can become sugar-limited even though starch remains abundant."
      ],
      "sources": [
        {
          "t": "Gänzle (2014) — Enzymatic and bacterial conversions during sourdough fermentation, Food Microbiology 37:2-10",
          "u": "https://doi.org/10.1016/j.fm.2013.04.007"
        },
        {
          "t": "Gobbetti & Gänzle eds (2023) — Handbook on Sourdough Biotechnology, 2nd ed., Springer",
          "u": "https://link.springer.com/book/10.1007/978-3-031-23084-4"
        }
      ],
      "questions": [
        {
          "q": "Why can flour β-amylase not liberate maltose from an intact starch granule?",
          "a": "β-Amylase is exo-acting: it trims maltose only from non-reducing chain ends, cannot pass α-1,6 branch points, and cannot enter intact granules. Maltose at rate requires α-amylase to endo-cleave α-1,4 bonds inside milling-damaged granules first, multiplying accessible ends."
        },
        {
          "q": "What breaks if a baker treats damaged starch as a defect to remove from the model?",
          "a": "The sugar-supply timeline collapses: the ~1% free-sugar pool lasts only hours, and with no damaged substrate for the amylases there is no ongoing maltose flux — the ferment starves instead of accelerating as pH falls."
        },
        {
          "q": "You inherit a starter that only ramps up after ~4 h and you suspect the white flour is enzyme-poor. What do you add, and what is the failure mode of overshooting?",
          "a": "Add a small percentage (1–3%) of diastatic malted flour or a fungal α-amylase preparation to raise dextrin supply for β-amylase. Overshooting yields a dextrin-laden, syrupy, fast-fermenting dough — the maltose flux must be matched to acid production, not maximized."
        },
        {
          "q": "Where does the glucose released by maltose phosphorylase end up, and why does that matter for the starter community?",
          "a": "L. sanfranciscensis exports it, and yeasts such as S. cerevisiae take it up — which is why maltose-phosphorylase LAB coexist with yeasts, while a yeast that also consumes maltose competes with the LAB for the same carbon and destabilizes the pair."
        }
      ]
    },
    {
      "id": "flour-microbiota",
      "phase": 0,
      "label": "Flour as inoculum",
      "desc": "The resident bacteria and yeasts riding on grain and flour — the small, mill-specific inoculum from which every starter's community is recruited, and how flour type shapes that recruitment.",
      "outline": [
        "Counts and composition: LAB, yeasts, and other bacteria per gram of flour, originating from the grain surface and mill equipment",
        "Lot-to-lot variation: why flours from different mills and grain lots carry different communities",
        "First fermentations: which taxa bloom in the initial doughs of a newly started starter",
        "Rye versus wheat flour as different inocula and nutrient bases",
        "Back-slopping as a selection engine: from ~10^2 CFU/g in flour to ~10^9 CFU/g in mature sourdough",
        "Stability: which ecological parameters fix the mature sourdough's core biota"
      ],
      "ideas": [
        "Flour is not sterile: typically ~10^2–10^3 bacteria per gram, LAB in the 10^1–10^3 range, and yeasts one to two logs lower — a small but fully sufficient inoculum.",
        "Flour identity drives strain identity: flours from different mills, fermented under the same recipe, yielded sourdoughs dominated by different LAB strains.",
        "Rye and wheat doughs recruit distinct communities: rye's higher enzyme and nutrient load selects different LAB and yeast taxa from the first preparations onward.",
        "Back-slopping, not the ambient air, fixes the core biota: repeated refreshments amplify acid-tolerant strains already present and wash out transient flour taxa.",
        "The amplification is enormous: ~10^2 CFU/g LAB in flour becomes ~10^8–10^9 CFU/g in mature sourdough — the starter is the flour microbiota multiplied ~10^7-fold and filtered for acid tolerance."
      ],
      "sources": [
        {
          "t": "Celano et al. (2016) — Different flour microbial communities drive to sourdoughs characterized by diverse bacterial strains, Front Microbiol 7:1770",
          "u": "https://www.frontiersin.org/journals/microbiology/articles/10.3389/fmicb.2016.01770/full"
        },
        {
          "t": "Ercolini et al. (2013) — Microbial ecology dynamics during rye and wheat sourdough preparation, Appl Environ Microbiol 79:7827-7836",
          "u": "https://doi.org/10.1128/aem.02955-13"
        },
        {
          "t": "Minervini et al. (2014) — Ecological parameters influencing microbial diversity and stability of traditional sourdough, Int J Food Microbiol 171:136-146",
          "u": "https://doi.org/10.1016/j.ijfoodmicro.2013.11.021"
        }
      ],
      "questions": [
        {
          "q": "What exactly is a flour inoculum, in numbers?",
          "a": "The viable microbiota carried on the grain and into the flour: order 10^2–10^3 bacteria per gram, of which LAB are ~10^1–10^3 CFU/g and yeasts are typically 10–100-fold fewer. It is the seed community every starter is recruited from."
        },
        {
          "q": "What breaks if you attribute your starter's strains to bakery air rather than to the flour?",
          "a": "The causal chain: identical recipes fermented with different flours produced sourdoughs with different dominant strains that tracked each flour's resident community — air contributes transient cells, but the flour inoculum and the back-slopped carry-over decide who dominates."
        },
        {
          "q": "Your starter has been sluggish since you switched mills. Which comparison tells you whether the flour microbiota is the cause?",
          "a": "Ferment the old and new flours side by side with the same recipe and track acidification rate and community composition; if the new flour's dough acidifies more slowly and recruits different LAB, the mill-to-mill community difference — not the recipe — explains it."
        },
        {
          "q": "Why does the community simplify over the first week of refreshments?",
          "a": "Each back-slop applies an acid-and-starvation filter: taxa that cannot grow at ~10^9 CFU/g density or tolerate pH ~4 drop out, while acid-tolerant, maltose-capable LAB dominate — the flour's species list is filtered down to a handful of strains."
        }
      ]
    },
    {
      "id": "dough-habitat",
      "phase": 0,
      "label": "Dough as microbial habitat",
      "desc": "Dough as a microbial habitat — its water activity, buffering, redox, and nutrient flows — and how those parameters select which cells colonize it and persist.",
      "outline": [
        "Physicochemical baseline: water activity ~0.95–0.97 at dough yields of 150–250, initial pH ~6.0, flour-buffered",
        "Carbon flow: free sugars first, then maltose from amylolysis; kneading-incorporated oxygen consumed within the first hour",
        "Electron-acceptor logic: fructose (and oxygen early) as acceptor for heterofermentative acetate production, with mannitol appearing as the reduced product",
        "Buffering: extraction rate and grain species set how much acid a given pH drop represents",
        "Temperature and dough yield as species selectors: L. sanfranciscensis near 30–33 °C versus thermotolerant lactobacilli at 35–37 °C",
        "Assembly rules: acid tolerance, maltose capability, and yeast–LAB cross-feeding determine who persists"
      ],
      "ideas": [
        "Dough is a nutrient-dense, near-anaerobic habitat at water activity ~0.95–0.97: kneading's oxygen disappears within about an hour, so heterofermentative metabolism is governed by electron-acceptor availability, not aeration.",
        "Buffering capacity scales with extraction rate — whole and rye flours absorb more acid per pH unit, so identical titratable acidity reads as a higher pH in rye or whole-grain dough.",
        "Heterofermentative LAB reduce fructose to mannitol to regenerate NAD+, which is why acetic acid and mannitol track together and fructose addition raises acetate without any aeration.",
        "The classic stable pair is L. sanfranciscensis + Kazachstania humilis: the yeast cannot ferment maltose and leaves it to the bacterium while living on sucrose and excreted glucose — substitute a maltose-fermenting S. cerevisiae and the association destabilizes.",
        "Routine back-slopping (10–20% inoculum, 12–24 h cycles at 20–30 °C) drives dough from pH ~6.0 to 3.8–4.3 and LAB to ~10^9 CFU/g; cooler or drier doughs stretch the same trajectory over days."
      ],
      "sources": [
        {
          "t": "De Vuyst et al. (2014) — Microbial ecology of sourdough fermentations: diverse or uniform?, Food Microbiology 37:11-29",
          "u": "https://doi.org/10.1016/j.fm.2013.06.002"
        },
        {
          "t": "De Vuyst, Van Kerrebroeck & Leroy (2017) — Microbial ecology and process technology of sourdough fermentation, Adv Appl Microbiol 100:49-160",
          "u": "https://doi.org/10.1016/bs.aambs.2017.02.003"
        },
        {
          "t": "Gobbetti & Gänzle eds (2023) — Handbook on Sourdough Biotechnology, 2nd ed., Springer",
          "u": "https://link.springer.com/book/10.1007/978-3-031-23084-4"
        }
      ],

  if(isNarrow()){guidePinned=false;setPanelOpen(false);}
  unpinTT();
  syncScrim();
});

// ---------- focus / selection ----------
function applyFocus(related,keepEdges){
  svg.classList.add("dimmed");
  for(const id in nodeEls){nodeEls[id].classList.toggle("related",related.has(id));}
  colEls.forEach(r=>r.classList.add("related"));
  svg.querySelectorAll(".collabel").forEach(t=>t.classList.add("related"));
  edgeEls.forEach((g,i)=>{
    const rel=keepEdges.has(i);
    g.classList.toggle("related",rel);
    const e=DATA.edges[i];
    g.classList.toggle("direct",rel&&(e.from===state.sel||e.to===state.sel));
  });
}
function clearSel(){
  state.sel=null;
  svg.classList.remove("dimmed");
  Object.values(nodeEls).forEach(g=>{g.classList.remove("related");g.classList.remove("sel");g.classList.remove("match");});
  edgeEls.forEach(g=>{g.classList.remove("related");g.classList.remove("direct");});
  renderDefaultPanel();
  if(isNarrow())setPanelOpen(!!guidePinned);
}
function select(id){
  state.sel=id;guidePinned=false;unpinTT();closeHeaderChrome();
  if(isNarrow())legend.classList.remove("is-open");
  const anc=new Set([id]),keepEdges=new Set(),stack=[id];
  while(stack.length){
    const cur=stack.pop();
    DATA.edges.forEach((e,i)=>{
      if(e.to===cur&&!anc.has(e.from)){anc.add(e.from);keepEdges.add(i);stack.push(e.from);}
    });
  }
  const related=new Set(anc);
  DATA.edges.forEach(e=>{if(e.from===id)related.add(e.to);});
  DATA.edges.forEach((e,i)=>{if(e.from===id)keepEdges.add(i);});
  Object.values(nodeEls).forEach(g=>g.classList.remove("sel"));
  nodeEls[id].classList.add("sel");
  applyFocus(related,keepEdges);
  renderNodePanel(id,anc.size-1);
  if(isNarrow())setPanelOpen(true);
}
function focusTheme(ti){
  state.sel=null;unpinTT();
  const related=new Set(DATA.nodes.filter(n=>n.phase===ti).map(n=>n.id));
  const keepEdges=new Set();
  DATA.edges.forEach((e,i)=>{if(related.has(e.from)||related.has(e.to))keepEdges.add(i);});
  svg.classList.add("dimmed");
  for(const id in nodeEls)nodeEls[id].classList.toggle("related",related.has(id));
  colEls.forEach(r=>r.classList.add("related"));
  edgeEls.forEach((g,i)=>g.classList.toggle("related",keepEdges.has(i)));
  renderThemePanel(ti);
}
function focusLevel(l){
  state.sel=null;unpinTT();
  const related=new Set(DATA.nodes.filter(n=>LEVEL[n.id]===l).map(n=>n.id));
  const keepEdges=new Set();
  DATA.edges.forEach((e,i)=>{if(related.has(e.from)||related.has(e.to))keepEdges.add(i);});
  svg.classList.add("dimmed");
  for(const id in nodeEls)nodeEls[id].classList.toggle("related",related.has(id));
  colEls.forEach(r=>r.classList.add("related"));
  edgeEls.forEach((g,i)=>g.classList.toggle("related",keepEdges.has(i)));
  renderLevelPanel(l);
}

// ---------- tooltip ----------
const tt=$("#tt");let pinnedEdge=null;
function showTT(html,px,py){
  if(usesTouchCopy()){
    tt.innerHTML=`<div class="sheet-handle"></div><div class="sheet-head narrow-only"><strong>Why this is a prerequisite</strong><button type="button" class="sheet-close" id="btn-why-close">Close</button></div>${html}`;
    tt.style.display="block";tt.style.left="0";tt.style.top="auto";
    const close=$("#btn-why-close");if(close)close.addEventListener("click",unpinTT);
    syncScrim();
    return;
  }
  tt.innerHTML=html;tt.style.display="block";
  const wrap=$("#canvaswrap").getBoundingClientRect();
  let x=px-wrap.left+14,y=py-wrap.top+14;
  const tw=tt.offsetWidth,th=tt.offsetHeight;
  if(x+tw>wrap.width-10)x=px-wrap.left-tw-14;
  if(y+th>wrap.height-10)y=py-wrap.top-th-14;
  tt.style.left=Math.max(4,x)+"px";tt.style.top=Math.max(4,y)+"px";
}
function hideTT(){if(pinnedEdge===null)tt.style.display="none";}
function unpinTT(){pinnedEdge=null;tt.style.display="none";edgeEls.forEach(g=>g.classList.remove("hov"));if(typeof syncScrim==="function")syncScrim();}
function edgeHTML(i){
  const e=DATA.edges[i];
  return `<div class="who">${nodeLabel(e.from)} <span class="arrow">→</span> ${nodeLabel(e.to)}</div><div>${e.why}</div>`;
}
function onEdgeEnter(i,ev){if(dragMoved||usesTouchCopy())return;edgeEls[i].classList.add("hov");if(pinnedEdge===null)showTT(edgeHTML(i),ev.clientX,ev.clientY);}
function onEdgeMove(ev){if(pinnedEdge!==null||usesTouchCopy())return;showTT(tt.innerHTML,ev.clientX,ev.clientY);}
function onEdgeLeave(i){if(usesTouchCopy())return;edgeEls[i].classList.remove("hov");if(pinnedEdge!==i)hideTT();}
function onEdgeActivate(i,ev){
  if(pinnedEdge===i){unpinTT();syncScrim();return;}
  pinnedEdge=i;edgeEls.forEach(g=>g.classList.remove("hov"));edgeEls[i].classList.add("hov");
  if(isNarrow()){legend.classList.remove("is-open");setPanelOpen(false);}
  showTT(edgeHTML(i),ev.clientX,ev.clientY);
}

// ---------- panel ----------
const panel=$("#panel");
function themeChip(ti){return `<span class="chip" style="background:${THEMES[ti].color}">${THEMES[ti].name}</span>`;}
function levelChip(l){const c=LCOL[l];return `<span class="chip" style="background:${c}${LUM(c)>0.28?";color:var(--ink)":""}">Level ${l}</span>`;}
function depBlock(dir,e){
  const other=dir==="req"?e.from:e.to;
  return `<div class="dep"><b data-goto="${other}">${dir==="req"?"← ":"→ "}${nodeLabel(other)}</b><p>${e.why}</p></div>`;
}
function gotoHandler(){
  panel.querySelectorAll("[data-goto]").forEach(b=>{
    if(b.dataset.goto==="__back")return;
    b.addEventListener("click",()=>{select(b.dataset.goto);centerOn(b.dataset.goto);});
  });
}
function bindBack(){
  panel.querySelectorAll("[data-goto='__back']").forEach(el=>{
    el.addEventListener("click",()=>{guidePinned=false;clearSel();});
  });
}
function sheetChrome(title){
  return `<div class="sheet-handle"></div><div class="sheet-head narrow-only"><strong>${title}</strong><button type="button" class="sheet-close" data-goto="__back">Close</button></div>`;
}
function renderNodePanel(id,ancCount){
  const n=nodeById(id);
  const reqs=DATA.edges.filter(e=>e.to===id).sort((a,b)=>LEVEL[a.from]-LEVEL[b.from]);
  const unl=DATA.edges.filter(e=>e.from===id).sort((a,b)=>LEVEL[a.to]-LEVEL[b.to]);
  let h=`${sheetChrome(n.label)}<span class="backlink" data-goto="__back">← overview</span><br>
  ${levelChip(LEVEL[id])} ${themeChip(n.phase)}
  <h2>${n.label}</h2><p>${n.desc}</p>
  <h3>Rough outline — study in this order</h3>
  <ol class="outline">${n.outline.map(o=>`<li>${o}</li>`).join("")}</ol>
  <h3>Key ideas</h3><ul>${n.ideas.map(i=>`<li>${i}</li>`).join("")}</ul>
  <h3>Mastery check — prove you know this</h3>
  ${n.questions.map((q,i)=>`<div class="dep"><b>Q${i+1}. ${q.q}</b><details><summary>Show answer</summary><p>${q.a}</p></details></div>`).join("")}
  <h3>Study sources</h3><ul>${n.sources.map(s=>`<li>${s.u?`<a href="${s.u}" target="_blank" rel="noopener">${s.t}</a>`:s.t}</li>`).join("")}</ul>`;
  h+=`<h3>Requires — why these are prerequisites (${reqs.length})</h3>`;
  h+=reqs.length?reqs.map(e=>depBlock("req",e)).join(""):"<p style='color:var(--muted)'>Nothing — this is an entry point.</p>";
  h+=`<h3>Unlocks (${unl.length})</h3>`;
  h+=unl.length?unl.map(e=>depBlock("unl",e)).join(""):"<p style='color:var(--muted)'>Nothing directly — this is a terminal destination.</p>";
  h+=`<p style="margin-top:14px;font-size:14px;color:var(--muted)">Graph focus: this node (highlighted), its ${ancCount} transitive prerequisite${ancCount===1?"":"s"}, and its direct downstream targets.</p>`;
  panel.innerHTML=h;
  bindBack();
  gotoHandler();
}
function renderThemePanel(ti){
  const ids=DATA.nodes.filter(n=>n.phase===ti).map(n=>n.id);
  panel.innerHTML=`${sheetChrome(THEMES[ti].name)}<span class="backlink" data-goto="__back">← overview</span><br>${themeChip(ti)}
  <h2>${THEMES[ti].name}</h2>
  <p>${THEME_BLURBS[ti]||""}</p>
  <h3>Concepts in this theme (${ids.length})</h3>
  ${ids.map(i=>`<div class="dep"><b data-goto="${i}">${nodeLabel(i)}</b> <span style="font-size:14px;color:var(--muted)">Level ${LEVEL[i]}</span><p>${nodeById(i).desc}</p></div>`).join("")}`;
  bindBack();
  gotoHandler();
  if(isNarrow())setPanelOpen(true);
}
function renderLevelPanel(l){
  const ids=DATA.nodes.filter(n=>LEVEL[n.id]===l).map(n=>n.id);
  panel.innerHTML=`${sheetChrome("Level "+l)}<span class="backlink" data-goto="__back">← overview</span><br>${levelChip(l)}
  <h2>Level ${l}</h2>
  <p>Everything on this level can be studied in parallel: nothing here depends on anything else at the same level, and every prerequisite sits strictly to the left.</p>
  <h3>Concepts at this level (${ids.length})</h3>
  ${ids.map(i=>`<div class="dep"><b data-goto="${i}">${nodeLabel(i)}</b> <span style="font-size:14px;color:var(--muted)">${THEMES[nodeById(i).phase].name}</span><p>${nodeById(i).desc}</p></div>`).join("")}`;
  bindBack();
  gotoHandler();
  if(isNarrow())setPanelOpen(true);
}
function renderDefaultPanel(){
  const nodeVerb=usesTouchCopy()?"Tap":"Click";
  const arrowLine=usesTouchCopy()
    ?"Tap any <b>arrow</b> for its rationale (tap again to dismiss). Drag to pan, pinch to zoom, search to jump."
    :"Hover or click any <b>arrow</b> for its rationale (click again to pin). Drag to pan, scroll to zoom, search to jump.";
  const colorLine=usesTouchCopy()
    ?"the tint deepens from the entry level at the left to the frontier at the right — the theme's depth ramp, also drawn in the Levels sheet (tap a band to focus that level)."
    :"the tint deepens from the entry level at the left to the frontier at the right — the theme's depth ramp, also drawn as the legend bar bottom-left (click a band to focus that level).";
  panel.innerHTML=`${sheetChrome("How to read this map")}
  <h2 style="margin-top:0">Concept dependency map</h2>
  <p>This map lays out the ${DATA.nodes.length} concepts between zero background and the end goal: <b>${GOAL_STATEMENT}</b></p>
  <h3>How to read it</h3>
  <ul>
    <li><b>Columns are topological levels.</b> An arrow A → B means learn A before B, so B always sits to the right of A. Everything in one column can be learned in parallel once the columns to its left are done.</li>
    <li><b>Color encodes depth:</b> ${colorLine}</li>
    <li>${nodeVerb} any <b>node</b> for its description, a <b>rough study outline</b> (ordered steps), key ideas, sources, and — for every arrow touching it — <b>why</b> that prerequisite holds.</li>
    <li>${nodeVerb === "Tap" ? "Tapping" : "Clicking"} a node also lights up its entire prerequisite chain: what you'd need to study, in the graph's own order.</li>
    <li>${arrowLine}</li>
  </ul>
  <h3>A suggested path through the graph</h3>
  <ul>
    ${SUGGESTED_PATH.map(s=>`<li><b>${s.h}:</b> ${s.t}</li>`).join("")}
  </ul>
  <h3>Themes</h3>
  <div>${THEMES.map((p,i)=>`<span class="chipbtn" data-phase="${i}" style="margin:2px"><span class="dot" style="background:${p.color}"></span>${p.name}</span>`).join("")}</div>
  <p style="font-size:14px;color:var(--muted)">${nodeVerb} a theme to highlight its nodes across the graph.</p>
  <h3>Sources</h3>
  <p style="font-size:14.5px">${GOAL_SOURCES_NOTE}</p>`;
  bindBack();
  panel.querySelectorAll("[data-phase]").forEach(b=>{
    b.addEventListener("click",()=>focusTheme(+b.dataset.phase));
  });
}

// ---------- search ----------
const searchInput=$("#search"),results=$("#results");
searchInput.addEventListener("input",()=>{
  const q=searchInput.value.trim().toLowerCase();
  if(!q){results.style.display="none";return;}
  const matches=DATA.nodes.filter(n=>
    n.label.toLowerCase().includes(q)||n.desc.toLowerCase().includes(q)||n.ideas.some(i=>i.toLowerCase().includes(q))||n.outline.some(o=>o.toLowerCase().includes(q))
  ).slice(0,8);
  results.innerHTML=matches.map(n=>`<div data-id="${n.id}">${n.label}<span class="rphase">${THEMES[n.phase].name}</span></div>`).join("")||"<div><i>No matches</i></div>";
  results.style.display="block";
  results.querySelectorAll("[data-id]").forEach(r=>{
    r.addEventListener("click",()=>{
      Object.values(nodeEls).forEach(g=>g.classList.remove("match"));
      nodeEls[r.dataset.id].classList.add("match");
      select(r.dataset.id);centerOn(r.dataset.id);
      results.style.display="none";searchInput.value="";
    });
  });
});
document.addEventListener("click",e=>{if(!e.target.closest(".searchwrap"))results.style.display="none";});
function centerOn(id){
  const p=pos[id],rect=svg.getBoundingClientRect();
  const cxg=p.x+NODE_W/2,cyg=p.y+NODE_H/2;
  view.x=rect.width/2-cxg*view.k;view.y=rect.height/2-cyg*view.k;applyView();
}

// ---------- legend & init ----------
const legend=$("#legend");
(function buildLegend(){
  const stops=LCOL.map((c,i)=>`${c} ${Math.round(100*i/(NLEVELS-1))}%`).join(", ");
  const bandVerb=usesTouchCopy()?"Tap":"Click";
  legend.innerHTML=`<div class="sheet-handle"></div>
  <div class="sheet-head narrow-only"><strong>Topological levels</strong><button type="button" class="sheet-close" id="btn-legend-close">Close</button></div>
  <div class="bar" style="background:linear-gradient(90deg, ${stops})"></div>
  <div class="barlabels"><span>0</span><span>topological level →</span><span>${MAXL}</span></div>
  <div class="cap">Every column is a dependency level: all its prerequisites sit strictly to the left, so a level can be studied in parallel. ${bandVerb} a band below to focus it.</div>
  <div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:5px">${LCOL.map((c,i)=>`<span class="chipbtn lvlchip" data-level="${i}" style="border-color:${c};font-size:14px;padding:1px 6px">${i}</span>`).join("")}</div>`;
  legend.querySelectorAll(".lvlchip").forEach(b=>b.addEventListener("click",()=>{
    if(isNarrow()){legend.classList.remove("is-open");$("#btn-legend").setAttribute("aria-expanded","false");}
    focusLevel(+b.dataset.level);
  }));
  const close=$("#btn-legend-close");if(close)close.addEventListener("click",()=>{legend.classList.remove("is-open");$("#btn-legend").setAttribute("aria-expanded","false");syncScrim();});
})();
$("#stats").textContent=`${DATA.nodes.length} concepts · ${DATA.edges.length} prerequisite links · ${NLEVELS} topological levels · build ${BUILD}`;
$("#hint").innerHTML=hintCopy();
renderDefaultPanel();
if(!isNarrow())panel.classList.add("is-open");
fit();

// ---------- theme toggle (engine): Themed ↔ Default, re-skins palette, fonts, and the depth ramp live ----------
const ANCHORS_THEMED=ANCHORS.slice();
let themedOn=true;
function recolorGraph(){
  LCOL.length=0;LCOL.push(...Array.from({length:NLEVELS},(_,l)=>levelColor(l)));
  cols.forEach((c,i)=>colEls[i].setAttribute("fill",LCOL[c.level]));
  svg.querySelectorAll(".collabel").forEach(t=>t.setAttribute("fill",LCOL[+t.dataset.level]));
  for(const id in nodeEls){const c=LCOL[LEVEL[id]],rc=nodeEls[id].querySelector("rect.main");rc.setAttribute("fill",c);rc.setAttribute("stroke",c);}
  const stops=LCOL.map((c,i)=>`${c} ${Math.round(100*i/(NLEVELS-1))}%`).join(", ");
  const bar=legend.querySelector(".bar");if(bar)bar.style.background=`linear-gradient(90deg, ${stops})`;
  legend.querySelectorAll(".lvlchip").forEach(b=>b.style.borderColor=LCOL[+b.dataset.level]);
}
function setTheme(on){
  themedOn=on;
  const t=on?THEME:THEME_DEFAULT;
  applyTheme(t);
  const ramp=on?ANCHORS_THEMED:THEME_DEFAULT.anchors;
  if(ramp&&ramp.length>=2){ANCHORS.length=0;ANCHORS.push(...ramp);}
  recolorGraph();
  $("#btn-theme").textContent=on?"Themed":"Default";
}
$("#btn-theme").addEventListener("click",()=>setTheme(!themedOn));
// deep link: open with #node-id to start with that concept selected
(function(){
  const id=location.hash&&location.hash.slice(1);
  if(id&&nodeEls[id]){select(id);centerOn(id);}
})();
</script>
